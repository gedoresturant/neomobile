<script>
const SUPABASE_URL="https://dxxvxfvftrrwwkwcemcd.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_yqPSqYX8Zaz_jVnxYr7LaA_CPoH6jzX";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const KEY='neo_v16_final'; const LOGO_KEY='neo_logo_v16';
let logoData=localStorage.getItem(LOGO_KEY)||'';
let invCounter=parseInt(localStorage.getItem('neo_counter_v16')||'1000');
let cur=JSON.parse(localStorage.getItem(KEY+'_cur')||'null');
let DB=JSON.parse(localStorage.getItem(KEY)||'null')||{
 cats:[{id:'c1',n:'آيفون',icon:'📱',subs:['iPhone 15 Pro Max','iPhone 15','iPhone 14']},{id:'c2',n:'سامسونج',icon:'📱',subs:['S24 Ultra','S23','A54']},{id:'c3',n:'شاومي',icon:'📱',subs:['Note 12','Poco X5']},{id:'c4',n:'اكسسوارات',icon:'🎧',subs:['سماعات','شواحن','جرابات']}],
 inv:[], purchases:[], sales:[], repairs:[],
 users:[{id:'admin',u:'admin',p:'admin123',n:'المدير العام',role:'admin',perms:{dash:true,invView:true,invAdd:true,invDel:true,cost:true,priceEdit:true,catM:true,shop:true,salesView:true,salesDel:true,repView:true,repM:true,usersM:true,jard:true,return:true,loss:true},active:true}]
};
function saveCloud(){ localStorage.setItem(KEY,JSON.stringify(DB)); localStorage.setItem('neo_counter_v16',invCounter.toString()); localStorage.setItem(LOGO_KEY,logoData||''); supabaseClient.from('neomobile_data').upsert({id:1,data:DB,counter:invCounter,logo:logoData,updated_at:new Date().toISOString(),updated_by:cur?cur.n:'system'}).then(()=>{}).catch(()=>{}); }
function save(){ saveCloud(); }
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function login(){ let u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value.trim(); let f=DB.users.find(x=>x.u===u&&x.p===p&&x.active!==false); if(!f){document.getElementById('le').innerText='اليوزر أو الباسورد غلط';return} localStorage.setItem(KEY+'_cur',JSON.stringify(f)); location.reload(); }
function logout(){localStorage.removeItem(KEY+'_cur'); location.reload()}
let page='dash';
window.invSearchQ=''; window.invCatFilter='all'; window.jardSearchQ=''; window.salesSearchQ=''; window.retSearchQ=''; window.repSearchQ='';
function calcSellFromMargin(){ let buy=parseFloat(document.getElementById('pbuy')?.value)||0; let margin=parseFloat(document.getElementById('pmargin')?.value)||0; if(buy>0){ let sell=margin>0?buy*(1+margin/100):buy*1.2; let el=document.getElementById('psell'); if(el) el.value=Math.round(sell);} }
function addProduct(){
 let name=document.getElementById('pn').value.trim(); let cat=document.getElementById('pc').value; let sub=document.getElementById('psub').value.trim()||'عام'; let imei=document.getElementById('pimei').value.trim(); let qty=parseInt(document.getElementById('pq').value)||0; let unitCost=parseFloat(document.getElementById('pbuy').value)||0; let margin=parseFloat(document.getElementById('pmargin').value)||0; let defSell=parseFloat(document.getElementById('psell').value)||0; let supplier=document.getElementById('psup').value.trim(); let invNo=document.getElementById('pinv').value.trim();
 if(!name||!imei||qty<=0||unitCost<=0||!supplier){alert('اكمل البيانات: اسم، باركود، كمية، شراء، مورد');return}
 let existing=DB.inv.find(x=>x.imei===imei);
 if(existing){
  let oldTotal=existing.qty*existing.avgBuy; let newTotal=qty*unitCost; let totalQty=existing.qty+qty; let newAvg=(oldTotal+newTotal)/totalQty;
  existing.qty=totalQty; existing.avgBuy=newAvg; existing.totalCost=totalQty*newAvg; existing.lastSupplier=supplier;
  if(defSell>0) existing.defaultSell=defSell; else if(margin>0) existing.defaultSell=Math.round(newAvg*(1+margin/100));
  DB.purchases.push({id:uid(),productId:existing.id,name,imei,qty,unitCost,totalCost:newTotal,avgAfter:newAvg,supplier,invoiceNo:invNo,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n});
  alert('✅ تم التحديث\nالمتوسط الجديد: '+newAvg.toFixed(0)+' ج');
 }else{
  let id=uid(); let sellPrice=defSell>0?defSell:(margin>0?Math.round(unitCost*(1+margin/100)):Math.round(unitCost*1.2));
  DB.inv.push({id,name,catId:cat,sub,imei,qty,avgBuy:unitCost,totalCost:qty*unitCost,defaultSell:sellPrice,margin,img:'📱',lastSupplier:supplier});
  DB.purchases.push({id:uid(),productId:id,name,imei,qty,unitCost,totalCost:qty*unitCost,avgAfter:unitCost,supplier,invoiceNo:invNo,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n});
  alert('✅ تمت الإضافة - سعر البيع '+sellPrice+' ج');
 }
 save(); render();
}
function deleteInvByIndex(idx){
 idx=Number(idx);
 if(idx<0||idx>=DB.inv.length){alert('خطأ');return}
 let p=DB.inv[idx];
 if(!confirm('مسح الصنف؟\n'+p.name+'\n'+p.imei+'\nكمية '+p.qty)) return;
 DB.inv.splice(idx,1);
 save(); render();
 alert('✅ تم المسح');
}
function deleteAllInv(){
 if(DB.inv.length===0){alert('المخزن فاضي');return}
 if(!confirm('مسح كل المخزن '+DB.inv.length+' صنف؟'))return;
 if(!confirm('تأكيد نهائي؟'))return;
 DB.inv=[]; save(); render();
}
function deleteSaleByIndex(idx){
 idx=Number(idx);
 if(idx<0||idx>=DB.sales.length) return;
 let s=DB.sales[idx];
 if(!confirm('مسح فاتورة #'+s.invoiceNo+' - '+s.name+'؟\nسيرجع للمخزن')) return;
 let prod=DB.inv.find(p=>p.id===s.productId||p.imei===s.imei);
 if(prod) prod.qty+=(s.qty||1);
 DB.sales.splice(idx,1);
 save(); render();
}
function deleteAllSales(){
 if(!confirm('مسح كل المبيعات '+DB.sales.length+' ؟'))return;
 DB.sales=[]; save(); render();
}
function exportToExcel(type){
 try{
  let data=[], filename='';
  if(type==='inv'){
   data=DB.inv.map((i,idx)=>{let cat=DB.cats.find(c=>c.id===i.catId); let bought=DB.purchases.filter(p=>p.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); if(bought===0) bought=i.qty+DB.sales.filter(s=>s.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); let sold=DB.sales.filter(s=>s.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); return {'#':idx+1,'الصنف':i.name,'الفئة':i.sub||'','القسم':cat?cat.n:'','الباركود':i.imei,'اشتريت':bought,'بعت':sold,'المتبقي':i.qty,'متوسط الشراء':i.avgBuy,'سعر البيع':i.defaultSell||'','المورد':i.lastSupplier||''};});
   filename='مخزن-'+today()+'.csv';
  }else if(type==='jard'){
   data=DB.inv.map((i,idx)=>{let bought=DB.purchases.filter(p=>p.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); if(bought===0) bought=i.qty+DB.sales.filter(s=>s.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); let sold=DB.sales.filter(s=>s.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); return {'#':idx+1,'الصنف':i.name,'الباركود':i.imei,'اشتريت كام':bought,'بعت كام':sold,'المتبقي':i.qty,'متوسط الشراء':i.avgBuy,'قيمة المتبقي':i.qty*i.avgBuy};});
   filename='جرد-'+today()+'.csv';
  }else if(type==='sales'){
   data=DB.sales.map((s,idx)=>({'#':idx+1,'فاتورة':s.invoiceNo,'التاريخ':s.date,'الصنف':s.name,'الباركود':s.imei,'العميل':s.client,'شراء':s.buyCost,'بيع':s.sellPrice,'ربح':s.profit}));
   filename='مبيعات-'+today()+'.csv';
  }else if(type==='purchases'){
   data=DB.purchases.map((p,idx)=>({'#':idx+1,'التاريخ':p.date,'الصنف':p.name,'الباركود':p.imei,'الكمية':p.qty,'سعر الشراء':p.unitCost,'الاجمالي':p.totalCost,'المورد':p.supplier,'فاتورة الشراء':p.invoiceNo||''}));
   filename='مشتريات-مرتجع-'+today()+'.csv';
  }else if(type==='repairs'){
   data=DB.repairs.map((r,idx)=>({'#':idx+1,'التاريخ':r.date,'الجهاز':r.device,'العميل':r.client,'العطل':r.issue,'التكلفة':r.cost,'الحالة':r.status}));
   filename='صيانة-'+today()+'.csv';
  }
  if(data.length===0){alert('لا يوجد بيانات');return}
  let csv='\uFEFF'+Object.keys(data[0]).join(',')+'\n'+data.map(row=>Object.values(row).map(v=>{let s=(v??'').toString().replace(/"/g,'""'); return /[",\n]/.test(s)?'"'+s+'"':s;}).join(',')).join('\n');
  let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=filename; a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);},500);
  alert('✅ تم تصدير '+filename);
 }catch(e){ alert('خطأ تصدير: '+e.message); console.error(e); }
}
let html5QrCode=null, _lastScanTarget='invSearchInput';
function openCameraScan(targetId){
 let wrap=document.getElementById('cameraScanWrap');
 if(!wrap){let div=document.createElement('div'); div.id='cameraScanWrap'; div.className='fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4'; div.innerHTML=`<div class="bg-white rounded-3xl p-5 w-full max-w-md text-center"><div class="font-black text-lg mb-2">📷 مسح بالكاميرا</div><div id="reader" class="w-full rounded-2xl overflow-hidden border-2 border-red-200"></div><div class="flex gap-2 mt-4"><button onclick="closeCameraScan()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold">إغلاق</button></div></div>`; document.body.appendChild(div); wrap=div;}else wrap.classList.remove('hidden');
 setTimeout(()=>{try{if(html5QrCode){try{html5QrCode.stop()}catch(e){}} html5QrCode=new Html5Qrcode("reader"); _lastScanTarget=targetId||'invSearchInput'; html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},(decodedText)=>{let inp=document.getElementById(_lastScanTarget); if(inp){inp.value=decodedText; inp.dispatchEvent(new Event('input')); window.invSearchQ=decodedText; window.jardSearchQ=decodedText; window.salesSearchQ=decodedText; window.retSearchQ=decodedText; render();} closeCameraScan();},()=>{});}catch(e){closeCameraScan();}},100);
}
function closeCameraScan(){let wrap=document.getElementById('cameraScanWrap'); if(wrap) wrap.classList.add('hidden'); if(html5QrCode){try{html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{})}catch(e){}}}
function startScan(targetId){_lastScanTarget=targetId; openCameraScan(targetId);}
function sellModal(id){let p=DB.inv.find(x=>x.id===id); if(!p)return; let suggested=p.defaultSell||Math.round(p.avgBuy*1.2); let htmlM=`<div id="sellModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl"><div class="text-3xl mb-2">📱</div><div class="font-black text-lg">${p.name}</div><div class="text-xs text-gray-500">${p.sub} - متاح: ${p.qty}</div><div class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-3 mt-3"><div class="text-xs">سعر مقترح</div><div class="font-black text-xl text-emerald-600">${suggested.toLocaleString()} ج</div></div><div class="mt-4 space-y-2 text-right"><label class="text-sm font-black">بيع بسعر آخر</label><input id="sellPrice" type="number" value="${suggested}" class="w-full border-2 border-red-300 rounded-xl px-3 py-4 text-center text-xl font-black"><input id="sellClient" placeholder="اسم العميل" class="w-full border rounded-xl px-3 py-2"><input id="sellPhone" placeholder="رقم الهاتف" class="w-full border rounded-xl px-3 py-2"></div><div class="flex gap-2 mt-4"><button onclick="doSell('${p.id}')" class="flex-1 bg-red-600 text-white py-4 rounded-xl font-black text-lg">بيع #${invCounter+1}</button><button onclick="document.getElementById('sellModal').remove()" class="flex-1 bg-gray-100 py-4 rounded-xl font-bold">إلغاء</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend',htmlM);}
function doSell(id){let p=DB.inv.find(x=>x.id===id); let price=parseFloat(document.getElementById('sellPrice').value); let client=document.getElementById('sellClient').value.trim()||'عميل'; let phone=document.getElementById('sellPhone').value.trim()||''; if(!price||price<=0){alert('اكتب السعر');return} if(p.qty<=0){alert('خلص');return} invCounter++; p.qty-=1; let sale={id:uid(),productId:p.id,name:p.name,imei:p.imei,qty:1,buyCost:p.avgBuy,sellPrice:price,profit:price-p.avgBuy,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n,client,clientPhone:phone,invoiceNo:invCounter.toString()}; DB.sales.push(sale); save(); document.getElementById('sellModal')?.remove(); showReceipt(sale); render();}
function showReceipt(s){let r=document.getElementById('receipt'); r.innerHTML=`${logoData?`<div class="text-center mb-2"><img src="${logoData}" class="mx-auto max-h-12"></div>`:''}<div class="text-center font-black text-[18px]">Neomobile</div><div class="flex justify-between"><span>فاتورة #</span><b>${s.invoiceNo}</b></div><div class="flex justify-between"><span>التاريخ:</span><span>${s.date}</span></div><div class="flex justify-between"><span>العميل:</span><b>${s.client}</b></div><div class="font-bold mt-2">${s.name}</div><div class="text-[10px]">${s.imei}</div><div class="flex justify-between mt-1"><span>الإجمالي</span><b>${s.sellPrice.toLocaleString()} ج</b></div><div class="mt-3 space-y-2"><button onclick="window.print()" class="w-full bg-black text-white py-2 rounded-lg font-bold no-print">🖨️ طباعة</button><button onclick="document.getElementById('receiptWrap').classList.add('hidden')" class="w-full bg-gray-100 py-2 rounded-lg font-bold no-print">إغلاق</button></div>`; document.getElementById('receiptWrap').classList.remove('hidden');}
function showReturn(imei){let p=DB.inv.find(x=>x.imei===imei); let purchases=DB.purchases.filter(x=>x.imei===imei); let sales=DB.sales.filter(x=>x.imei===imei); let prodName=p?p.name:(purchases[0]?.name||'غير معروف'); let lastPurchase=purchases.length?purchases[purchases.length-1]:null; let buyPrice=lastPurchase?lastPurchase.unitCost:(p?p.avgBuy:0); let supplier=lastPurchase?lastPurchase.supplier:(p?p.lastSupplier:''); let lastSale=sales.length?sales[sales.length-1]:null; let htmlM=`<div id="returnModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-lg text-center shadow-2xl"><div class="font-black text-xl">${prodName}</div><div class="mt-4 space-y-2 text-right bg-gray-50 rounded-2xl p-4"><div class="flex justify-between"><span>الباركود</span><b class="text-xs">${imei}</b></div><div class="flex justify-between"><span>سعر الشراء</span><b>${buyPrice} ج</b></div><div class="flex justify-between"><span>المورد</span><b>${supplier}</b></div><div class="flex justify-between"><span>اتباع بكام</span><b>${lastSale?lastSale.sellPrice:'لم يباع'}</b></div></div><div class="flex gap-2 mt-4"><button onclick="let prod=DB.inv.find(x=>x.imei==='${imei}'); if(prod)prod.qty+=1; save(); document.getElementById('returnModal').remove(); render();" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-black">إرجاع للمخزن</button><button onclick="document.getElementById('returnModal').remove()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold">إغلاق</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend',htmlM);}
function addCat(){let n=document.getElementById('cn').value.trim(); if(!n)return; DB.cats.push({id:uid(),n,icon:'📱',subs:[]}); save(); render();}
function delCat(id){if(!confirm('مسح القسم؟'))return; DB.cats=DB.cats.filter(x=>x.id!==id); save(); render();}
function addSubCat(catId){let name=prompt('اسم النوع الفرعي'); if(!name)return; let cat=DB.cats.find(c=>c.id===catId); if(!cat.subs) cat.subs=[]; cat.subs.push(name.trim()); save(); render();}
function delSubCat(catId,idx){let cat=DB.cats.find(c=>c.id===catId); cat.subs.splice(idx,1); save(); render();}
function addUser(){let n=document.getElementById('un').value.trim(), u=document.getElementById('uu').value.trim(), p=document.getElementById('up').value.trim(); if(!n||!u||!p){alert('اكمل البيانات');return} let perms={}; document.querySelectorAll('.permChk').forEach(ch=>{perms[ch.dataset.perm]=ch.checked}); DB.users.push({id:uid(),u,p,n,role:document.getElementById('ur').value,perms,active:true}); save(); render();}
function editPerms(id){let user=DB.users.find(x=>x.id===id); if(!user.perms) user.perms={}; let html=`<div id="permModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-5 w-full max-w-md max-h-[80vh] overflow-auto"><div class="font-black text-center mb-3">تعديل صلاحيات ${user.n}</div><div class="grid grid-cols-2 gap-2 text-xs text-right">${Object.entries({dash:'لوحة التحكم',invView:'عرض المخزن',invAdd:'إضافة للمخزن',invDel:'مسح المخزن',cost:'عرض التكلفة',priceEdit:'تعديل السعر',catM:'إدارة الفئات',shop:'نقطة البيع',salesView:'عرض المبيعات',salesDel:'مسح المبيعات',repView:'عرض الصيانة',repM:'إدارة الصيانة',usersM:'إدارة المستخدمين',jard:'الجرد',return:'المرتجع',loss:'البيع بخسارة'}).map(([k,l])=>`<label class="flex items-center gap-2 border rounded-xl px-3 py-2"><input type="checkbox" data-perm="${k}" ${user.perms[k]?'checked':''} class="editPerm"> ${l}</label>`).join('')}</div><div class="flex gap-2 mt-4"><button onclick="savePerms('${id}')" class="flex-1 bg-red-600 text-white py-2 rounded-xl">حفظ</button><button onclick="document.getElementById('permModal').remove()" class="flex-1 bg-gray-100 py-2 rounded-xl">إلغاء</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend',html);}
function savePerms(id){let user=DB.users.find(x=>x.id===id); document.querySelectorAll('.editPerm').forEach(ch=>{user.perms[ch.dataset.perm]=ch.checked}); save(); document.getElementById('permModal')?.remove(); render();}
function changePass(id){let np=prompt('الباسورد الجديد:'); if(!np)return; DB.users.find(x=>x.id===id).p=np; save(); alert('تم تغيير الباسورد');}

function deleteUser(id){if(id==='admin'){alert('لا يمكن مسح الأدمن');return} if(!confirm('مسح المستخدم؟'))return; DB.users=DB.users.filter(x=>x.id!==id); save(); render();}
function uploadLogo(){let inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=e=>{let f=e.target.files[0]; if(!f)return; let rd=new FileReader(); rd.onload=ev=>{logoData=ev.target.result; save(); render();}; rd.readAsDataURL(f);}; inp.click();}
function removeLogo(){logoData=''; save(); render();}
function addRepair(){let device=document.getElementById('rdevice').value.trim(), client=document.getElementById('rclient').value.trim(), phone=document.getElementById('rphone').value.trim(), issue=document.getElementById('rissue').value.trim(), cost=parseFloat(document.getElementById('rcost').value)||0; if(!device||!client||!issue){alert('اكمل');return} DB.repairs.push({id:uid(),device,client,phone,issue,cost,status:'قيد الصيانة',date:today(),by:cur.n}); save(); render();}

h===0?'<div class="text-center py-8 text-gray-400">لا يوجد صيانة</div>':''}</div></div></div>`;

 else if(page==='users'){

ms-center hover:shadow-md transition bg-white"><div><div class="font-black text-lg flex items-center gap-2">${u.n} ${u.role==='admin'?'<span class="bg-red-600 text-white text-[10px] px-2 py-1 rounded-full">مدير عام</span>':u.role==='sales'?'<span class="bg-blue-100 text-blue-600 text-[10px] px-2 py-1 rounded-full">كاشير</span>':'<span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-1 rounded-full">مخزن</span>'}</div><div class="text-xs text-gray-500">اليوزر: ${u.u} - ${u.active!==false?'✅ نشط':'❌ موقوف'}</div><div class="text-[10px] text-gray-400 mt-1">${u.perms?Object.entries(u.perms).filter(([k,v])=>v).length+' صلاحية':(u.role==='admin'?'كل الصلاحيات':'صلاحيات افتراضية')}</div></div><div class="flex gap-2"><button onclick="editPerms('${u.id}')" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-xl text-xs font-bold">✏️ صلاحيات</button><button onclick="changePass('${u.id}')" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-xl text-xs font-bold">🔑 باسورد</button><button onclick="deleteUser('${u.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-xs font-bold">🗑️</button></div></div>`).join('')}</div></div></div>`;

(async()=>{
 try{ let res=await supabaseClient.from('neomobile_data').select('*').eq('id',1).single(); if(res.data&&res.data.data&&DB.inv.length===0&&res.data.data.inv&&res.data.data.inv.length>0){ if(confirm('تحميل من السحابة؟')){DB=res.data.data; invCounter=res.data.counter||invCounter; if(res.data.logo){logoData=res.data.logo; localStorage.setItem(LOGO_KEY,logoData);} localStorage.setItem(KEY,JSON.stringify(DB)); } } }catch(e){}
 supabaseClient.channel('neomobile').on('postgres_changes',{event:'*',schema:'public',table:'neomobile_data',filter:'id=eq.1'},(payload)=>{ if(payload.new&&payload.new.data&&JSON.stringify(payload.new.data)!==JSON.stringify(DB)){ if(confirm('تحديث جديد من جهاز تاني - تحميل؟')){DB=payload.new.data; invCounter=payload.new.counter||invCounter; localStorage.setItem(KEY,JSON.stringify(DB)); render();} } }).subscribe();
 render();
})();
