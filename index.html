<script>
const SUPABASE_URL="https://dxxvxfvftrrwwkwcemcd.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_yqPSqYX8Zaz_jVnxYr7LaA_CPoH6jzX";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const KEY='neo_v16_final'; const LOGO_KEY='neo_logo_v16';
let logoData=localStorage.getItem(LOGO_KEY)||'';
let invCounter=parseInt(localStorage.getItem('neo_counter_v16')||'1000');
let cur=JSON.parse(localStorage.getItem(KEY+'_cur')||'null');
let DB=JSON.parse(localStorage.getItem(KEY)||'null')||{
 cats:[{id:'c1',n:'آيفون',icon:'📱',subs:['iPhone 15 Pro Max','iPhone 15','iPhone 14']},{id:'c2',n:'سامسونج',icon:'📱',subs:['S24 Ultra','S23','A54']},{id:'c3',n:'شاومي',icon:'📱',subs:['Note 12','Poco X5']},{id:'c4',n:'اكسسوارات',icon:'🎧',subs:['سماعات','شواحن','جرابات']}],
 inv:[], purchases:[], sales:[], returns:[], repairs:[],
 users:[{id:'admin',u:'admin',p:'admin123',n:'المدير العام',role:'admin',perms:{dash:true,invView:true,invAdd:true,invDel:true,cost:true,priceEdit:true,catM:true,shop:true,salesView:true,salesDel:true,repView:true,repM:true,usersM:true,jard:true,return:true,loss:true},active:true}]
};
if(!Array.isArray(DB.returns)) DB.returns=[];

function isAdmin(){return !!cur&&String(cur.id)==='admin'&&DB.users.some(u=>String(u.id)==='admin'&&u.active!==false)}
function audit(action,details=''){if(!DB.logs)DB.logs=[];DB.logs.unshift({id:uid(),date:new Date().toLocaleDateString('en-CA'),time:new Date().toLocaleTimeString('ar-EG'),user:cur?cur.n:'غير معروف',username:cur?cur.u:'',action,details:String(details||'')});if(DB.logs.length>5000)DB.logs.length=5000;}
function requireAdminDelete(){if(!isAdmin()){alert('الصلاحية دي متاحة لحساب الأدمن الأساسي فقط');audit('محاولة مسح مرفوضة','المستخدم: '+(cur?.u||'غير معروف')+' حاول تنفيذ عملية حذف');saveCloud();return false}return true;}
let cloudSyncState='جارٍ الاتصال بالسحابة…';
let cloudSaveQueue=Promise.resolve();
function showCloudSyncState(message,isError=false){
 cloudSyncState=message;
 let el=document.getElementById('cloudSyncStatus');
 if(el){el.textContent=(isError?'⚠️ ':'☁️ ')+message;el.className='text-[11px] font-bold px-3 py-1 rounded-full '+(isError?'bg-red-100 text-red-700':'bg-emerald-100 text-emerald-700');}
}
function saveCloud(){
 localStorage.setItem(KEY,JSON.stringify(DB)); localStorage.setItem('neo_counter_v16',invCounter.toString()); localStorage.setItem(LOGO_KEY,logoData||'');
 const payload={id:1,data:DB,counter:invCounter,logo:logoData,updated_at:new Date().toISOString(),updated_by:cur?cur.n:'system'};
 cloudSaveQueue=cloudSaveQueue.then(async()=>{
  showCloudSyncState('جاري حفظ البيانات…');
  const {error}=await supabaseClient.from('neomobile_data').upsert(payload,{onConflict:'id'});
  if(error){console.error('Supabase save failed:',error);showCloudSyncState('فشل حفظ السحابة: '+(error.message||'تحقق من الاتصال والصلاحيات'),true);return false;}
  showCloudSyncState('تم حفظ البيانات على السحابة'); return true;
 }).catch(err=>{console.error('Supabase save failed:',err);showCloudSyncState('تعذر الاتصال بالسحابة؛ البيانات محفوظة على هذا الجهاز فقط',true);return false;});
 return cloudSaveQueue;
}
function save(){ audit('حفظ / تعديل بيانات','تم تسجيل عملية حفظ بيانات النظام'); saveCloud(); }
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
// Global HTML escaper used by render branches such as device tracking.
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function today(){return new Date().toISOString().slice(0,10)}
function login(){ let u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value.trim(); let f=DB.users.find(x=>x.u===u&&x.p===p&&x.active!==false); if(!f){document.getElementById('le').innerText='اليوزر أو الباسورد غلط';return} localStorage.setItem(KEY+'_cur',JSON.stringify(f)); cur=f; audit('تسجيل دخول','تم تسجيل الدخول بنجاح'); saveCloud(); location.reload(); }
function logout(){audit('تسجيل خروج','تم تسجيل الخروج');saveCloud();localStorage.removeItem(KEY+'_cur'); location.reload()}
let page='dash';
window.invSearchQ=''; window.invCatFilter='all'; window.jardSearchQ=''; window.salesSearchQ=''; window.retSearchQ=''; window.repSearchQ=''; window.unitTrackSearchQ='';
function focusProductColor(){const c=document.getElementById('pcolor');if(c){c.focus();if(c.select)c.select();}}
function calcSellFromMargin(){ let buy=parseFloat(document.getElementById('pbuy')?.value)||0; let margin=parseFloat(document.getElementById('pmargin')?.value)||0; if(buy>0){ let sell=margin>0?buy*(1+margin/100):buy*1.2; let el=document.getElementById('psell'); if(el) el.value=Math.round(sell);} }
function addProduct(){
 let name=document.getElementById('pn').value.trim(); let cat=document.getElementById('pc').value; let sub=document.getElementById('psub').value.trim()||'عام'; let color=document.getElementById('pcolor').value.trim(); let imei=document.getElementById('pimei').value.trim(); let qty=parseInt(document.getElementById('pq').value)||0; let unitCost=parseFloat(document.getElementById('pbuy').value)||0; let margin=parseFloat(document.getElementById('pmargin').value)||0; let defSell=parseFloat(document.getElementById('psell').value)||0; let supplier=document.getElementById('psup').value.trim(); let invNo=document.getElementById('pinv').value.trim();
 if(!name||!imei||qty===0||defSell<=0){alert('اكمل البيانات الإلزامية: اسم الصنف، الباركود، الكمية، وسعر البيع (لازم يكون أكبر من صفر). سعر الشراء والمورد ورقم الفاتورة اختياريين.');return}
 if(unitCost<0){alert('سعر الشراء لا يمكن أن يكون بالسالب');return}
 // ربط الباركود باللون: نفس الباركود لا يجوز أن يشير إلى لونين مختلفين.
 const norm=v=>String(v??'').trim().replace(/\s+/g,' ').toLocaleLowerCase();
 const barcodeOwner=DB.inv.find(x=>String(x.imei||'').trim()===imei);
 if(barcodeOwner && (norm(barcodeOwner.name)!==norm(name)||norm(barcodeOwner.sub||'عام')!==norm(sub)||String(barcodeOwner.catId||'')!==String(cat||'')||norm(barcodeOwner.color||'')!==norm(color||''))){alert('الباركود '+imei+' مرتبط بالفعل بالصنف/اللون: '+barcodeOwner.name+' - '+(barcodeOwner.color||'لون غير محدد')+'\nاستخدم باركودًا مختلفًا لكل لون.');return;}
 let existing=DB.inv.find(x=>String(x.imei||'').trim()===imei&&norm(x.name)===norm(name)&&norm(x.sub||'عام')===norm(sub)&&String(x.catId||'')===String(cat||'')&&norm(x.color||'')===norm(color||''));
 if(existing){
  let oldQty=Number(existing.qty)||0;
  if(qty<0){
   // Negative quantity is a stock adjustment, not a purchase transaction.
   existing.qty=oldQty+qty;
   existing.totalCost=Math.max(0,existing.qty)*(Number(existing.avgBuy)||unitCost);
   existing.lastSupplier=supplier;
   alert('✅ تم تسجيل تسوية مخزون بالسالب: '+qty+' قطعة\nالرصيد الجديد: '+existing.qty+' قطعة');
  }else{
   let oldPositiveQty=Math.max(0,oldQty); let oldTotal=oldPositiveQty*(Number(existing.avgBuy)||0); let newTotal=qty*unitCost; let totalQty=oldQty+qty;
   let newAvg=totalQty>0?(oldQty>0?(oldTotal+newTotal)/totalQty:unitCost):(Number(existing.avgBuy)||unitCost);
   existing.qty=totalQty; existing.avgBuy=newAvg; existing.totalCost=Math.max(0,totalQty)*newAvg; if(supplier) existing.lastSupplier=supplier;
   existing.defaultSell=defSell; if(color) existing.color=color;
   if(qty>0) DB.purchases.push({id:uid(),productId:existing.id,name:existing.name,imei,qty,unitCost,totalCost:newTotal,avgAfter:newAvg,supplier,invoiceNo:invNo,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n});
   alert('✅ تم تحديث نفس الصنف والنوع\nمتوسط تكلفة الشراء: '+newAvg.toFixed(2)+' ج');
  }
 }else{
  let id=uid(); let sellPrice=defSell;
  DB.inv.push({id,name,catId:cat,sub,color,imei,qty,avgBuy:unitCost,totalCost:Math.max(0,qty)*unitCost,defaultSell:sellPrice,margin,img:'📱',lastSupplier:supplier});
  if(qty>0){DB.purchases.push({id:uid(),productId:id,name,imei,qty,unitCost,totalCost:qty*unitCost,avgAfter:unitCost,supplier,invoiceNo:invNo,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n});alert('✅ تمت الإضافة - سعر البيع '+sellPrice+' ج');}
  else {alert('✅ تمت إضافة الصنف برصيد سالب '+qty+' قطعة. لم يتم إنشاء فاتورة شراء لأن هذه تسوية مخزون وليست عملية شراء.');}
 }
 save(); render();
}

function editInv(id){
 const p=DB.inv.find(x=>x.id===id); if(!p){alert('الصنف غير موجود');return;}
 const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
 const cats=DB.cats.map(c=>`<option value="${esc(c.id)}" ${c.id===p.catId?'selected':''}>${esc(c.n)}</option>`).join('');
 const purchaseRows=(DB.purchases||[]).filter(x=>String(x.productId||'')===String(p.id)||(!x.productId&&String(x.name||'')===String(p.name||''))).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
 const latestPurchase=purchaseRows[purchaseRows.length-1]||null;
 const modal=`<div id="editInvModal" class="fixed inset-0 bg-black/60 z-[90] flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-5 w-full max-w-xl max-h-[90vh] overflow-y-auto shadow-2xl"><h3 class="text-xl font-black text-center mb-4">✏️ تعديل بيانات الصنف</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><label class="text-sm font-bold">اسم الصنف<input id="editInvName" value="${esc(p.name)}" class="mt-1 w-full border rounded-xl px-3 py-3"></label><label class="text-sm font-bold">الفئة / القسم<select id="editInvCat" class="mt-1 w-full border rounded-xl px-3 py-3">${cats}</select></label><label class="text-sm font-bold">النوع / المجموعة<input id="editInvSub" value="${esc(p.sub||'')}" class="mt-1 w-full border rounded-xl px-3 py-3"></label><label class="text-sm font-bold">اللون<input id="editInvColor" value="${esc(p.color||'')}" placeholder="مثال: أسود، أزرق، أبيض" class="mt-1 w-full border rounded-xl px-3 py-3"></label><label class="text-sm font-bold">السيريال / الباركود<div class="mt-1 flex gap-1"><input id="editInvImei" value="${esc(p.imei)}" class="flex-1 min-w-0 border-2 border-yellow-300 rounded-xl px-3 py-3 text-center font-bold"><button type="button" onclick="startScan('editInvImei')" class="bg-black text-white px-4 rounded-xl whitespace-nowrap">📷 Scan</button></div></label><label class="text-sm font-bold">الكمية المتاحة<input id="editInvQty" type="number" min="-999999" step="1" value="${Number(p.qty)||0}" class="mt-1 w-full border rounded-xl px-3 py-3"></label><label class="text-sm font-bold">متوسط تكلفة الشراء<input id="editInvBuy" type="number" min="0" step="0.01" value="${Number(p.avgBuy)||0}" class="mt-1 w-full border rounded-xl px-3 py-3"></label><label class="text-sm font-bold">سعر البيع<input id="editInvSell" type="number" min="0" step="0.01" value="${Number(p.defaultSell)||0}" class="mt-1 w-full border rounded-xl px-3 py-3"></label><label class="text-sm font-bold">المورد<input id="editInvSupplier" value="${esc(p.lastSupplier||'')}" class="mt-1 w-full border rounded-xl px-3 py-3"></label><label class="text-sm font-bold">رقم فاتورة الشراء<input id="editInvPurchaseInvoice" value="${esc(latestPurchase?.invoiceNo||'')}" placeholder="رقم فاتورة الشراء" class="mt-1 w-full border rounded-xl px-3 py-3"></label></div><p class="text-xs text-gray-500 mt-3">تعديل رقم الفاتورة هنا يحدّث أحدث حركة شراء مسجلة للصنف. يمكن تسجيل رصيد سالب لتوضيح عجز المخزون؛ تعديل الكمية يدويًا لا ينشئ حركة شراء أو بيع. لإضافة بضاعة جديدة سجّل كمية شراء موجبة.</p><div class="flex gap-2 mt-5"><button onclick="saveEditInv('${esc(p.id)}')" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-black">حفظ التعديلات</button><button onclick="document.getElementById('editInvModal').remove()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold">إلغاء</button></div></div></div>`;
 document.getElementById('editInvModal')?.remove(); document.body.insertAdjacentHTML('beforeend',modal);
}
function saveEditInv(id){
 const p=DB.inv.find(x=>x.id===id); if(!p){alert('الصنف غير موجود');return;}
 const name=document.getElementById('editInvName').value.trim();
 const catId=document.getElementById('editInvCat').value; const sub=document.getElementById('editInvSub').value.trim()||'عام'; const color=document.getElementById('editInvColor').value.trim();
 const imei=document.getElementById('editInvImei').value.trim(); const qty=Number(document.getElementById('editInvQty').value);
 const buy=Number(document.getElementById('editInvBuy').value); const sell=Number(document.getElementById('editInvSell').value); const supplier=document.getElementById('editInvSupplier').value.trim(); const purchaseInvoice=document.getElementById('editInvPurchaseInvoice')?.value.trim()||'';
 if(!name||!imei||!Number.isInteger(qty)||!Number.isFinite(buy)||buy<0||!Number.isFinite(sell)||sell<0){alert('راجع البيانات: الاسم والباركود مطلوبان، والكمية يجب أن تكون عددًا صحيحًا، والأسعار أرقامًا غير سالبة. يمكن أن يكون رصيد المخزن سالبًا لتسجيل العجز.');return;}
 if(DB.inv.some(x=>x.id!==id&&x.imei===imei)){alert('الباركود/السيريال مستخدم بالفعل لصنف آخر.');return;}
 p.name=name;p.catId=catId;p.sub=sub;p.color=color;p.imei=imei;p.qty=qty;p.avgBuy=buy;p.totalCost=qty*buy;p.defaultSell=sell;p.lastSupplier=supplier;
 const purchaseRows=(DB.purchases||[]).filter(x=>String(x.productId||'')===String(p.id)||(!x.productId&&String(x.name||'')===String(p.name||''))).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
 if(purchaseRows.length){purchaseRows[purchaseRows.length-1].invoiceNo=purchaseInvoice;if(supplier)purchaseRows[purchaseRows.length-1].supplier=supplier;}
 save(); document.getElementById('editInvModal')?.remove(); render(); alert('تم حفظ تعديلات الصنف');
}

 idx=Number(idx);

 DB.inv.splice(idx,1);
 audit('مسح صنف من المخزن','الصنف: '+p.name+' | الباركود: '+p.imei); save(); render();

 if(DB.inv.length===0){alert('المخزن فاضي');return}

 let prod=DB.inv.find(p=>p.id===s.productId||p.imei===s.imei);
 if(prod) prod.qty+=(s.qty||1);
 DB.sales.splice(idx,1);
 audit('مسح فاتورة بيع','رقم الفاتورة: '+s.invoiceNo+' | الصنف: '+s.name); save(); render();

function deleteAllSales(){if(!requireAdminDelete())return;
 if(!confirm('مسح كل المبيعات '+DB.sales.length+' ؟'))return;

function exportToExcel(type){
 try{
  let data=[], filename='';
  if(type==='inv'){
   data=DB.inv.map((i,idx)=>{let cat=DB.cats.find(c=>c.id===i.catId); let bought=DB.purchases.filter(p=>p.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); if(bought===0) bought=i.qty+DB.sales.filter(s=>s.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); let sold=DB.sales.filter(s=>s.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); return {'#':idx+1,'الصنف':i.name,'الفئة':i.sub||'','اللون':i.color||'','القسم':cat?cat.n:'','الباركود':i.imei,'اشتريت':bought,'بعت':sold,'المتبقي':i.qty,'متوسط الشراء':i.avgBuy,'سعر البيع':i.defaultSell||'','المورد':i.lastSupplier||''};});
   filename='مخزن-'+today()+'.csv';
  }else if(type==='jard'){
   data=DB.inv.map((i,idx)=>{let bought=DB.purchases.filter(p=>p.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); if(bought===0) bought=i.qty+DB.sales.filter(s=>s.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); let sold=DB.sales.filter(s=>s.imei===i.imei).reduce((s,x)=>s+(x.qty||0),0); return {'#':idx+1,'الصنف':i.name,'اللون':i.color||'','الباركود':i.imei,'اشتريت كام':bought,'بعت كام':sold,'المتبقي':i.qty,'متوسط الشراء':i.avgBuy,'قيمة المتبقي':i.qty*i.avgBuy};});

function doSell(id){let p=DB.inv.find(x=>x.id===id);if(!p){alert('الصنف غير موجود');return}let price=parseFloat(document.getElementById('sellPrice').value);let qty=parseInt(document.getElementById('sellQty').value,10);let client=document.getElementById('sellClient').value.trim()||'عميل';let phone=document.getElementById('sellPhone').value.trim()||'';if(!Number.isFinite(price)||price<=0){alert('اكتب سعر بيع صحيح للقطعة');return}if(!Number.isInteger(qty)||qty<1){alert('اكتب كمية صحيحة أكبر من صفر');return}let payments=readSalePayments(),totalDue=price*qty,paidTotal=payments.cash+payments.visa+payments.instapay+payments.wallet;if([payments.cash,payments.visa,payments.instapay,payments.wallet].some(v=>!Number.isFinite(v)||v<0)){alert('راجع مبالغ طرق التحصيل');return}if(Math.abs(paidTotal-totalDue)>0.01){alert('مجموع الكاش والفيزا وإنستاباي والمحفظة لازم يساوي إجمالي الفاتورة ('+totalDue.toLocaleString('ar-EG')+' ج).');return}if(!Array.isArray(p.unitBarcodes)){let code=String(document.getElementById('saleSharedBarcode')?.value||'').trim();if(!code||code!==String(p.imei||'').trim()){alert('الباركود لا يطابق الباركود المسجل للصنف.');return}if(Number(p.qty)<qty){alert('الكمية المتاحة غير كافية. المتاح: '+p.qty);return}invCounter++;let invoiceNo=invCounter.toString();p.qty=Number(p.qty)-qty;let sale={id:uid(),productId:p.id,name:p.name,color:p.color||'',imei:code,imeis:Array(qty).fill(code),qty,buyCost:Number(p.avgBuy)||0,sellPrice:price,profit:(price-(Number(p.avgBuy)||0))*qty,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n,client,clientPhone:phone,invoiceNo,barcodeMode:'shared',payments,paymentSummary:{cash:payments.cash,visa:payments.visa,instapay:payments.instapay,wallet:payments.wallet}};DB.sales.push(sale);save();document.getElementById('sellModal')?.remove();showReceipt(sale);render();return}let barcodes=Array.from(document.querySelectorAll('.sale-unit-barcode')).map(x=>x.value.trim());if(barcodes.length!==qty||barcodes.some(x=>!x)){alert('لازم تدخل أو تمسح باركود لكل قطعة. المطلوب '+qty+' باركود.');return}if(new Set(barcodes).size!==barcodes.length){alert('فيه باركود مكرر. كل قطعة لازم يكون لها باركود مختلف.');return}let units=[];for(let code of barcodes){let unit=DB.inv.find(x=>Array.isArray(x.unitBarcodes)&&x.unitBarcodes.includes(code));if(!unit){let legacy=DB.inv.find(x=>String(x.imei||'').trim()===code);if(legacy&&Number(legacy.qty)===1&&!Array.isArray(legacy.unitBarcodes))unit=legacy;else if(legacy&&Number(legacy.qty)>1){alert('الصنف '+legacy.name+' عنده كمية مجمعة. افتح المخزن واضغط «باركودات القطع» وسجّل باركودًا مستقلًا لكل قطعة أولًا.');return}else{alert('الباركود '+code+' غير مسجل كباركود قطعة متاحة. افتح المخزن واضغط «باركودات القطع» لتسجيل باركودات الصنف.');return}}if(!(unit.name===p.name&&(unit.sub||'')===(p.sub||'')&&unit.catId===p.catId&&(unit.color||'')===(p.color||''))){alert('الباركود '+code+' يخص صنفًا مختلفًا عن '+p.name+'.');return}if((Number(unit.qty)||0)<1){alert('الباركود '+code+' رصيده غير متاح أو تم بيعه بالفعل.');return}units.push({unit,code})}if(units.length!==qty){alert('عدد الباركودات لا يطابق الكمية');return}let qtyByUnit=new Map();units.forEach(x=>qtyByUnit.set(x.unit,(qtyByUnit.get(x.unit)||0)+1));for(const [unit,count] of qtyByUnit){if((Number(unit.qty)||0)<count){alert('الكمية المتاحة غير كافية للصنف '+unit.name);return}}invCounter++;let invoiceNo=invCounter.toString();units.forEach(({unit,code})=>{unit.qty-=1;if(Array.isArray(unit.unitBarcodes))unit.unitBarcodes=unit.unitBarcodes.filter(x=>x!==code)});let sale={id:uid(),productId:p.id,name:p.name,color:p.color||'',imei:barcodes[0],imeis:barcodes.slice(),qty,buyCost:units.reduce((n,x)=>n+(Number(x.unit.avgBuy)||0),0)/qty,sellPrice:price,profit:units.reduce((n,x)=>n+(price-(Number(x.unit.avgBuy)||0)),0),date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n,client,clientPhone:phone,invoiceNo,payments,paymentSummary:{cash:payments.cash,visa:payments.visa,instapay:payments.instapay,wallet:payments.wallet}};DB.sales.push(sale);save();document.getElementById('sellModal')?.remove();showReceipt(sale);render();}

function downloadBackup(){
 try{
  const payload={app:'Neomobile',formatVersion:1,createdAt:new Date().toISOString(),data:DB,counter:invCounter,logo:logoData||''};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='Neomobile-Backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  alert('تم تنزيل النسخة الاحتياطية. احتفظ بالملف في مكان آمن.');
 }catch(e){alert('تعذر إنشاء النسخة الاحتياطية: '+e.message);}
}
function restoreBackupFile(input){
 const file=input.files&&input.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result); const restored=parsed&&parsed.data?parsed.data:parsed;
   if(!restored||!Array.isArray(restored.inv)||!Array.isArray(restored.cats)||!Array.isArray(restored.purchases)||!Array.isArray(restored.sales)||!Array.isArray(restored.users)) throw new Error('الملف ليس نسخة احتياطية صحيحة من Neomobile');
   if(!confirm('استعادة النسخة الاحتياطية ستستبدل البيانات الحالية بالكامل. يُفضّل تنزيل نسخة احتياطية من الوضع الحالي أولًا. هل تريد المتابعة؟')){input.value='';return;}
   DB=restored;
   if(parsed.counter!==undefined) invCounter=Number(parsed.counter)||invCounter;
   if(parsed.logo!==undefined) logoData=parsed.logo||'';
   save(); input.value=''; render(); alert('تمت استعادة النسخة الاحتياطية. راجع البيانات قبل متابعة العمل.');
  }catch(e){alert('فشل استعادة النسخة: '+e.message);input.value='';}
 };
 reader.onerror=()=>{alert('تعذر قراءة الملف');input.value='';}; reader.readAsText(file);

function buildUnitTrackingRows(){
 const rows=[]; const norm=v=>String(v??'').trim().toLowerCase();
 for(const product of DB.inv){
  const purchases=(DB.purchases||[]).filter(x=>String(x.productId||'')===String(product.id)||String(x.imei||'')===String(product.imei||'' )).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  const sold=[];
  for(const sale of (DB.sales||[])){
   const codes=Array.isArray(sale.imeis)&&sale.imeis.length?sale.imeis:[sale.imei].filter(Boolean);
   for(const code of codes){if((sale.productId&&String(sale.productId)===String(product.id))||(!sale.productId&&norm(sale.name)===norm(product.name))){sold.push({code:String(code),sale});}}
  }
  const codes=new Set([...(Array.isArray(product.unitBarcodes)?product.unitBarcodes:[]).map(String),...sold.map(x=>x.code)]);
  // Legacy products with a single unit IMEI can be tracked without migration.
  if(Number(product.qty)===1 && product.imei && !Array.isArray(product.unitBarcodes)) codes.add(String(product.imei));
  for(const code of codes){
   const saleMatch=sold.filter(x=>x.code===code).sort((a,b)=>String(a.sale.date||'').localeCompare(String(b.sale.date||''))).slice(-1)[0];
   const mappedPurchaseId=product.unitBarcodePurchaseIds&&product.unitBarcodePurchaseIds[code];
   const mappedPurchase=mappedPurchaseId?purchases.find(x=>String(x.id)===String(mappedPurchaseId)):null;
   const exactPurchase=purchases.find(x=>String(x.imei||'')===code)||null;
   const purchaseMatch=mappedPurchase||exactPurchase||(purchases.length===1?purchases[0]:null);
   const available=Array.isArray(product.unitBarcodes)&&product.unitBarcodes.map(String).includes(code) && Number(product.qty)>0;
   rows.push({product,code,status:saleMatch?'مباع':available?'متاح':'غير محدد',purchaseDate:purchaseMatch?.date||'',supplier:purchaseMatch?.supplier||(purchases.length===0?product.lastSupplier||'':''),purchaseInvoice:purchaseMatch?.invoiceNo||'',saleDate:saleMatch?.sale?.date||'',saleTime:saleMatch?.sale?.time||'',saleInvoice:saleMatch?.sale?.invoiceNo||'',client:saleMatch?.sale?.client||'',buyCost:purchaseMatch?.unitCost??product.avgBuy??'',sellPrice:saleMatch?.sale?.sellPrice??'',sourceKnown:!!purchaseMatch});
  }
 }
 return rows;
}
