<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neomobile Cloud - Supabase</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:'Cairo',sans-serif}
body{background:#f8fafc}
@media print{ body *{visibility:hidden} #receiptWrap, #receiptWrap *{visibility:visible} #receiptWrap{position:fixed;top:0;right:0;width:80mm;max-width:80mm;margin:0;padding:5mm;background:white;color:black} .no-print{display:none!important} }
.receipt-line{border-top:1px dashed #000;padding:6px 0;margin:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="receiptWrap" class="hidden fixed inset-0 bg-black/50 z-[999] flex items-center justify-center p-4">
 <div id="receipt" class="bg-white border border-black w-[302px] max-w-[80mm] text-[12px] leading-5 p-3 text-black"></div>
</div>
<script>
// 🔥 ضع هنا بيانات Supabase بتاعتك
const SUPABASE_URL = "https://dxxvxfvftrrwwkwcemcd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yqPSqYX8Zaz_jVnxYr7LaA_CPoH6jzX";

let supabaseClient = null;
let isSupabaseReady = false;
try{
 if(!SUPABASE_URL.includes("YOUR_PROJECT")){
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  isSupabaseReady = true;
 }
}catch(e){ console.log(e); }

const KEY='neo_supabase_v1';
const LOGO_KEY='neo_logo';
let logoData=localStorage.getItem(LOGO_KEY)||'';
let invCounter=parseInt(localStorage.getItem('neo_inv_counter')||'1000');
let cur=JSON.parse(localStorage.getItem(KEY+'_cur')||'null');

let DB = JSON.parse(localStorage.getItem(KEY)||'null') || {
 cats:[{id:'iph',n:'آيفون',icon:'📱',subs:[]},{id:'sam',n:'سامسونج',icon:'📱',subs:[]},{id:'acc',n:'اكسسوارات',icon:'🎧',subs:[]}],
 inv:[], purchases:[], sales:[], repairs:[],
 users:[{id:'admin',u:'admin',p:'admin123',n:'المدير العام',role:'admin',perms:{dash:true,invView:true,invAdd:true,invDel:true,cost:true,priceEdit:true,catM:true,shop:true,salesView:true,salesDel:true,repView:true,repM:true,usersM:true,download:true,loss:true,jard:true,return:true},active:true}]
};

async function saveToCloud(){
 localStorage.setItem(KEY, JSON.stringify(DB));
 localStorage.setItem('neo_inv_counter', invCounter.toString());
 if(!isSupabaseReady) return;
 try{
  const payload = {
   id: 1,
   data: DB,
   counter: invCounter,
   jard: JSON.parse(localStorage.getItem('neo_jard')||'[]'),
   jard_by_item: JSON.parse(localStorage.getItem('neo_jard_by_item')||'[]'),
   logo: logoData,
   updated_at: new Date().toISOString(),
   updated_by: cur?cur.n:'system'
  };
  const { error } = await supabaseClient.from('neomobile_data').upsert(payload);
  if(error) console.error(error); else { let ind=document.getElementById('cloudIndicator'); if(ind) ind.innerHTML='☁️ متزامن Supabase'; }
 }catch(e){ console.error(e); }
}

async function loadFromCloud(){
 if(!isSupabaseReady) return false;
 try{
  const { data, error } = await supabaseClient.from('neomobile_data').select('*').eq('id',1).single();
  if(error || !data) return false;
  return data;
 }catch(e){ return false; }
}

function setupRealtime(){
 if(!isSupabaseReady) return;
 const channel = supabaseClient.channel('neomobile-changes')
  .on('postgres_changes', {event:'*', schema:'public', table:'neomobile_data', filter:'id=eq.1'}, (payload)=>{
   if(payload.new){
    let newData = payload.new.data;
    if(JSON.stringify(newData) !== JSON.stringify(DB)){
     if(confirm('فيه تحديث جديد من جهاز تاني - تحمّل التحديث؟')){
      DB = newData;
      invCounter = payload.new.counter||invCounter;
      if(payload.new.jard) localStorage.setItem('neo_jard', JSON.stringify(payload.new.jard));
      if(payload.new.jard_by_item) localStorage.setItem('neo_jard_by_item', JSON.stringify(payload.new.jard_by_item));
      if(payload.new.logo){ localStorage.setItem(LOGO_KEY, payload.new.logo); logoData=payload.new.logo; }
      localStorage.setItem(KEY, JSON.stringify(DB));
      localStorage.setItem('neo_inv_counter', invCounter.toString());
      render();
     }
    }
   }
  }).subscribe();
}

let page='dash'; let searchQ=''; let filterCat='all'; let salesFilter={q:''};

function save(){ saveToCloud(); }
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function has(p){if(!cur)return false; if(cur.role==='admin')return true; return cur.perms&&cur.perms[p]}
function login(){ let u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value.trim(); let f=DB.users.find(x=>x.u===u && x.p===p && x.active); if(!f){document.getElementById('le').innerText='اليوزر أو الباسورد غلط';return} localStorage.setItem(KEY+'_cur',JSON.stringify(f)); location.reload(); }
function logout(){localStorage.removeItem(KEY+'_cur'); location.reload()}
function go(p){page=p; render()}

function addProduct(){
 let name=document.getElementById('pn').value.trim();
 let cat=document.getElementById('pc').value;
 let sub=document.getElementById('psub').value.trim()||'عام';
 let imei=document.getElementById('pimei').value.trim();
 let qty=parseInt(document.getElementById('pq').value)||0;
 let unitCost=parseFloat(document.getElementById('pbuy').value)||0;
 let supplier=document.getElementById('psup').value.trim();
 let invNo=document.getElementById('pinv').value.trim();
 let defSell=parseFloat(document.getElementById('psell').value)||0;
 if(!name||!imei||qty<=0||unitCost<=0||!supplier){alert('اكمل البيانات');return}
 let existing=DB.inv.find(x=>x.imei===imei);
 if(existing){ let oldTotal=existing.qty*existing.avgBuy; let newTotal=qty*unitCost; let totalQty=existing.qty+qty; let newAvg=(oldTotal+newTotal)/totalQty; existing.qty=totalQty; existing.avgBuy=newAvg; existing.totalCost=totalQty*newAvg; existing.lastSupplier=supplier; DB.purchases.push({id:uid(),productId:existing.id,name,imei,qty,unitCost,totalCost:newTotal,avgAfter:newAvg,supplier,invoiceNo:invNo,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n}); alert(`تم التحديث: ${totalQty}`); }else{ let id=uid(); DB.inv.push({id,name,catId:cat,sub,imei,qty,avgBuy:unitCost,totalCost:qty*unitCost,defaultSell:defSell,img:'📱',lastSupplier:supplier}); DB.purchases.push({id:uid(),productId:id,name,imei,qty,unitCost,totalCost:qty*unitCost,avgAfter:unitCost,supplier,invoiceNo:invNo,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n}); alert('تمت الإضافة'); }
 save(); render();
}

let html5QrCode=null; let _lastScanTarget='searchInput';
function openCameraScan(targetId){ let wrap=document.getElementById('cameraScanWrap'); if(!wrap){ let div=document.createElement('div'); div.id='cameraScanWrap'; div.className='fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4'; div.innerHTML=`<div class="bg-white rounded-3xl p-5 w-full max-w-md text-center"><div class="font-black text-lg mb-2">📷 مسح بالكاميرا</div><div id="reader" class="w-full rounded-2xl overflow-hidden border-2 border-red-200"></div><div class="flex gap-2 mt-4"><button onclick="closeCameraScan()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold">إغلاق</button></div></div>`; document.body.appendChild(div); wrap=div; } else wrap.classList.remove('hidden'); setTimeout(()=>{ try{ if(html5QrCode){ try{html5QrCode.stop()}catch(e){} } html5QrCode=new Html5Qrcode("reader"); _lastScanTarget=targetId||'searchInput'; html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},(decodedText)=>{ let inp=document.getElementById(_lastScanTarget)||document.getElementById('returnInput')||document.getElementById('searchInput')||document.getElementById('pimei'); if(inp){ inp.value=decodedText; inp.dispatchEvent(new Event('input')); if(_lastScanTarget==='returnInput'||page==='return') showReturn(decodedText); else { let f=DB.inv.find(x=>x.imei===decodedText); if(f) sellModal(f.id); } } closeCameraScan(); },()=>{}).catch(()=>{ alert('الكاميرا غير متاحة'); closeCameraScan(); }); }catch(e){ closeCameraScan(); } },100); }
function closeCameraScan(){ let wrap=document.getElementById('cameraScanWrap'); if(wrap) wrap.classList.add('hidden'); if(html5QrCode){ try{ html5QrCode.stop().then(()=>{html5QrCode.clear()}).catch(()=>{}) }catch(e){} } }
function startScan(targetId){ let choice=confirm('OK = كاميرا\nCancel = جهاز باركود USB'); if(choice) openCameraScan(targetId); else { let inp=document.getElementById(targetId)||document.getElementById('searchInput')||document.getElementById('returnInput')||document.getElementById('pimei'); if(inp){ inp.focus(); inp.value=''; inp.placeholder='جاهز للمسح بجهاز الباركود...'; _lastScanTarget=targetId; inp.onkeydown=(e)=>{ if(e.key==='Enter'){ let val=e.target.value.trim(); if(val){ if(targetId==='returnInput'||page==='return') showReturn(val); else { let f=DB.inv.find(x=>x.imei===val); if(f) sellModal(f.id); else { searchQ=val; render(); } } } } }; } } }

function sellModal(id){ let p=DB.inv.find(x=>x.id===id); if(!p)return; let htmlM=`<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center"><div class="text-3xl mb-2">${p.img}</div><div class="font-black">${p.name}</div><div class="text-xs text-gray-400">متاح: ${p.qty}</div><div class="mt-4 space-y-2 text-right"><label class="text-sm font-bold">سعر البيع *</label><input id="sellPrice" type="number" placeholder="سعر البيع" class="w-full border rounded-xl px-3 py-3 text-center text-lg font-black"><input id="sellClient" placeholder="اسم العميل" class="w-full border rounded-xl px-3 py-2"><input id="sellPhone" placeholder="رقم الهاتف" class="w-full border rounded-xl px-3 py-2"></div><div class="flex gap-2 mt-4"><button onclick="doSell('${p.id}')" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-black">بيع #${invCounter+1}</button><button onclick="render()" class="flex-1 bg-gray-100 py-3 rounded-xl">إلغاء</button></div></div></div>`; document.getElementById('app').insertAdjacentHTML('beforeend',htmlM); setTimeout(()=>document.getElementById('sellPrice')?.focus(),100); }
function doSell(id){ let p=DB.inv.find(x=>x.id===id); let price=parseFloat(document.getElementById('sellPrice').value); let client=document.getElementById('sellClient').value.trim()||'عميل'; let phone=document.getElementById('sellPhone').value.trim()||''; if(!price||price<=0){alert('سعر البيع');return} if(p.qty<=0){alert('خلص');return} invCounter++; p.qty-=1; let saleId=uid(); let seq=invCounter.toString(); DB.sales.push({id:saleId,productId:p.id,name:p.name,imei:p.imei,qty:1,buyCost:p.avgBuy,sellPrice:price,profit:price-p.avgBuy,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n,client,clientPhone:phone,invoiceNo:seq,sequentialNo:seq}); save(); showReceipt(DB.sales[DB.sales.length-1]); render(); }
function showReceipt(s){ let r=document.getElementById('receipt'); r.innerHTML=`${logoData?`<div class="text-center mb-2"><img src="${logoData}" class="mx-auto max-h-12 max-w-[120px]"></div>`:''}<div class="text-center font-black text-[18px] mb-1">Neomobile</div><div class="receipt-line"></div><div class="flex justify-between"><span>فاتورة #</span><b>#${s.invoiceNo}</b></div><div class="flex justify-between"><span>التاريخ:</span><span>${s.date} ${s.time}</span></div><div class="flex justify-between"><span>العميل:</span><b>${s.client}</b></div><div class="receipt-line"></div><div class="font-bold">${s.name}</div><div class="text-[10px]">${s.imei}</div><div class="flex justify-between mt-1"><span>الكمية: 1</span><b>${s.sellPrice} ج</b></div><div class="receipt-line"></div><div class="flex justify-between font-black"><span>الإجمالي</span><span>${s.sellPrice} ج</span></div><div class="receipt-line"></div><div class="text-center text-[10px]">شكراً</div><div class="no-print mt-3 space-y-2"><button onclick="window.print()" class="w-full bg-black text-white py-2 rounded-lg">🖨️ طباعة</button><button onclick="document.getElementById('receiptWrap').classList.add('hidden')" class="w-full bg-gray-100 py-2 rounded-lg">إغلاق</button></div>`; document.getElementById('receiptWrap').classList.remove('hidden'); }

function uploadLogo(){ let inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=e=>{ let f=e.target.files[0]; if(!f)return; let rd=new FileReader(); rd.onload=ev=>{ localStorage.setItem(LOGO_KEY, ev.target.result); logoData=ev.target.result; save(); render(); }; rd.readAsDataURL(f); }; inp.click(); }
function removeLogo(){ localStorage.removeItem(LOGO_KEY); logoData=''; save(); render(); }

function showReturn(imei){
 let p=DB.inv.find(x=>x.imei===imei);
 let purchases=DB.purchases.filter(x=>x.imei===imei|| (p&&x.productId===p.id));
 let sales=DB.sales.filter(x=>x.imei===imei|| (p&&x.productId===p.id));
 if(!p && !purchases.length){ alert('غير موجود'); return; }
 let prodName=p? p.name : (purchases[0]?.name||'غير معروف');
 let lastPurchase=purchases.length? purchases[purchases.length-1]:null;
 let supplier=lastPurchase? lastPurchase.supplier : (p? p.lastSupplier:'غير معروف');
 let buyPrice=lastPurchase? lastPurchase.unitCost : (p? p.avgBuy:0);
 let lastSale=sales.length? sales[sales.length-1]:null;
 let sellPrice=lastSale? lastSale.sellPrice:'لم يباع';
 let htmlM=`<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-lg text-center"><div class="font-black text-xl">↩️ ${prodName}</div><div class="mt-4 space-y-3 text-right bg-gray-50 rounded-2xl p-4"><div class="flex justify-between border-b pb-2"><span>نوع المنتج</span><b>${prodName}</b></div><div class="flex justify-between border-b pb-2"><span>الباركود</span><b class="text-xs">${imei}</b></div><div class="flex justify-between border-b pb-2"><span>سعر الشراء</span><b class="text-red-600">${buyPrice} ج</b></div><div class="flex justify-between border-b pb-2"><span>المورد</span><b>${supplier}</b></div><div class="flex justify-between"><span>اتباع بكام</span><b class="text-emerald-600">${sellPrice}</b></div></div><div class="flex gap-2 mt-4"><button onclick="let prod=DB.inv.find(x=>x.imei==='${imei}'); if(prod)prod.qty+=1; save(); render();" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-black">إرجاع</button><button onclick="render()" class="flex-1 bg-gray-100 py-3 rounded-xl">إغلاق</button></div></div></div>`;
 document.getElementById('app').insertAdjacentHTML('beforeend',htmlM);
}
function showReturnByInvoice(invNo){ let sale=DB.sales.find(s=>s.invoiceNo===invNo); if(!sale){alert('فاتورة غير موجودة');return} showReceipt(sale); }

function addUser(){ let n=document.getElementById('un').value.trim(); let u=document.getElementById('uu').value.trim(); let p=document.getElementById('up').value.trim(); if(!n||!u||!p){alert('اكمل');return} let perms={}; document.querySelectorAll('.permChk').forEach(ch=>{perms[ch.dataset.perm]=ch.checked}); DB.users.push({id:uid(),u,p,n,role:'sales',perms,active:true}); save(); render(); }

function render(){
 let app=document.getElementById('app');
 if(!cur){
  app.innerHTML=`<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-red-900 via-red-700 to-black p-4"><div class="bg-white rounded-3xl p-8 w-full max-w-sm text-center shadow-2xl">${logoData?`<img src="${logoData}" class="mx-auto max-h-16 mb-3 rounded-xl">`:`<div class="w-16 h-16 bg-gradient-to-r from-red-600 to-black text-white rounded-2xl flex items-center justify-center font-black text-2xl mx-auto mb-3">N</div>`}<div class="font-black text-2xl">Neomobile Cloud</div><div class="text-xs ${isSupabaseReady?'text-emerald-600':'text-red-500'} mb-4">${isSupabaseReady?'☁️ متصل Supabase - متزامن':'⚠️ ضع إعدادات Supabase'}</div><input id="lu" placeholder="اسم المستخدم" class="w-full border rounded-xl px-3 py-3 mb-2 text-center"><input id="lp" type="password" placeholder="كلمة المرور" class="w-full border rounded-xl px-3 py-3 mb-2 text-center"><div id="le" class="text-red-500 text-xs mb-2"></div><button onclick="login()" class="w-full bg-gradient-to-r from-red-600 to-black text-white py-3 rounded-xl font-black">دخول</button></div></div>`; return;
 }
 let menu=`<div class="bg-white border-b sticky top-0 z-40"><div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between"><div class="flex items-center gap-2">${logoData?`<img src="${logoData}" class="h-8 rounded-lg">`:`<div class="w-9 h-9 bg-gradient-to-r from-red-600 to-black text-white rounded-xl flex items-center justify-center font-black">N</div>`}<b>Neomobile Cloud</b><span id="cloudIndicator" class="text-[10px] ${isSupabaseReady?'text-emerald-600':'text-gray-400'}">${isSupabaseReady?'☁️ Supabase متزامن':'📴 محلي'}</span></div><div class="text-xs">مرحبا ${cur.n} <button onclick="logout()" class="mr-2 bg-gray-100 px-3 py-1 rounded-lg">خروج</button></div></div><div class="max-w-6xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto"><button onclick="go('dash')" class="px-4 py-2 rounded-xl text-sm font-bold ${page==='dash'?'bg-red-600 text-white':'bg-gray-100'}">الرئيسية</button><button onclick="go('inv')" class="px-4 py-2 rounded-xl text-sm font-bold ${page==='inv'?'bg-red-600 text-white':'bg-gray-100'}">المخزن</button><button onclick="go('shop')" class="px-4 py-2 rounded-xl text-sm font-bold ${page==='shop'?'bg-red-600 text-white':'bg-gray-100'}">نقطة البيع</button><button onclick="go('sales')" class="px-4 py-2 rounded-xl text-sm font-bold ${page==='sales'?'bg-red-600 text-white':'bg-gray-100'}">المبيعات</button><button onclick="go('return')" class="px-4 py-2 rounded-xl text-sm font-bold ${page==='return'?'bg-red-600 text-white':'bg-gray-100'}">↩️ المرتجع</button><button onclick="go('users')" class="px-4 py-2 rounded-xl text-sm font-bold ${page==='users'?'bg-red-600 text-white':'bg-gray-100'}">المستخدمين</button></div></div>`;
 let content='';
 if(page==='dash'){
  let totalVal=DB.inv.reduce((s,x)=>s+x.qty*x.avgBuy,0);
  let totalQty=DB.inv.reduce((s,x)=>s+x.qty,0);
  content=`<div class="max-w-6xl mx-auto p-4"><div class="bg-gradient-to-r from-emerald-600 to-black text-white rounded-3xl p-5 mb-4 text-center"><div class="font-black">☁️ Supabase Cloud متزامن</div><div class="text-xs opacity-80">أي مبيعة على الكمبيوتر تظهر على الموبايل فوراً - فواتير متسلسلة</div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="bg-white rounded-2xl p-4 text-center"><div class="text-xs text-gray-400">قيمة المخزن</div><div class="font-black text-lg">${totalVal.toLocaleString()} ج</div></div><div class="bg-white rounded-2xl p-4 text-center"><div class="text-xs text-gray-400">القطع</div><div class="font-black text-lg">${totalQty}</div></div><div class="bg-white rounded-2xl p-4 text-center"><div class="text-xs text-gray-400">مبيعات اليوم</div><div class="font-black text-lg">${DB.sales.filter(x=>x.date===today()).length}</div></div><div class="bg-white rounded-2xl p-4 text-center"><div class="text-xs text-gray-400">الفاتورة القادمة</div><div class="font-black text-lg">#${invCounter+1}</div></div></div></div>`;
 }
 else if(page==='inv'){
  content=`<div class="max-w-6xl mx-auto p-4"><div class="bg-white rounded-3xl p-5 shadow-sm"><h3 class="font-black text-center mb-4">المخزن Cloud</h3><div class="border-2 border-dashed border-red-200 rounded-2xl p-4 grid grid-cols-2 gap-2 mb-4"><input id="pn" placeholder="اسم الصنف" class="border rounded-xl px-3 py-2 text-center"><input id="pimei" placeholder="باركود *" class="border rounded-xl px-3 py-2 text-center"><input id="pq" type="number" placeholder="الكمية" class="border rounded-xl px-3 py-2 text-center"><input id="pbuy" type="number" placeholder="سعر الشراء" class="border rounded-xl px-3 py-2 text-center"><input id="psup" placeholder="المورد" class="border rounded-xl px-3 py-2 text-center"><input id="psell" type="number" placeholder="سعر البيع" class="border rounded-xl px-3 py-2 text-center"><button onclick="addProduct()" class="col-span-2 bg-red-600 text-white py-3 rounded-xl font-black">إضافة - Cloud</button></div><div class="overflow-x-auto"><table class="w-full text-sm text-center"><tr class="text-xs text-gray-400 border-b"><td>الصنف</td><td>الباركود</td><td>الكمية</td></tr>${DB.inv.map(i=>`<tr class="border-b"><td>${i.name}</td><td class="text-xs">${i.imei}</td><td>${i.qty}</td></tr>`).join('')}</table></div></div></div>`;
 }
 else if(page==='shop'){
  let list=DB.inv.filter(i=>{ if(searchQ){let q=searchQ.toLowerCase(); return i.name.toLowerCase().includes(q)||i.imei.toLowerCase().includes(q)} return true; });
  content=`<div class="max-w-6xl mx-auto p-4"><div class="bg-white rounded-3xl p-4 shadow-sm mb-3"><div class="flex gap-2"><input id="searchInput" value="${searchQ}" oninput="searchQ=this.value;render()" placeholder="بحث باركود - جهاز أو كاميرا" class="flex-1 border rounded-xl px-3 py-3 text-center"><button onclick="startScan('searchInput')" class="bg-red-600 text-white px-4 rounded-xl font-bold">📷 مسح</button></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3">${list.map(i=>`<div class="bg-white rounded-2xl p-3 text-center shadow-sm"><div class="font-bold text-sm">${i.name}</div><div class="text-[11px] text-gray-400">متاح ${i.qty}</div><button onclick="sellModal('${i.id}')" class="mt-2 w-full py-2 rounded-xl text-sm font-black bg-red-600 text-white">بيع #${invCounter+1}</button></div>`).join('')}</div></div>`;
 }
 else if(page==='sales'){
  let rows=DB.sales.slice().reverse();

 else if(page==='return'){

 }
 else if(page==='users'){

 app.innerHTML=menu+content+`<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded-full text-sm z-50"></div><div id="cameraScanWrap" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-5 w-full max-w-md text-center"><div class="font-black text-lg mb-2">📷 مسح بالكاميرا</div><div id="reader" class="w-full rounded-2xl overflow-hidden border-2 border-red-200"></div><div class="flex gap-2 mt-4"><button onclick="closeCameraScan()" class="flex-1 bg-gray-100 py-3 rounded-xl">إغلاق</button></div></div></div>`;
}

(async()=>{
 if(isSupabaseReady){
  const cloudData = await loadFromCloud();
  if(cloudData && cloudData.data && Object.keys(cloudData.data).length>0){
   // If local empty, auto load cloud
   if(DB.inv.length===0 && cloudData.data.inv && cloudData.data.inv.length>0){
    if(confirm('تحميل البيانات من السحابة Supabase؟')){
     DB=cloudData.data;
     invCounter=cloudData.counter||invCounter;
     if(cloudData.jard) localStorage.setItem('neo_jard', JSON.stringify(cloudData.jard));
     if(cloudData.jard_by_item) localStorage.setItem('neo_jard_by_item', JSON.stringify(cloudData.jard_by_item));
     if(cloudData.logo){ localStorage.setItem(LOGO_KEY, cloudData.logo); logoData=cloudData.logo; }
     localStorage.setItem(KEY, JSON.stringify(DB));
     localStorage.setItem('neo_inv_counter', invCounter.toString());
    }
   }
  }
  setupRealtime();
 }
 render();
})();

render();
