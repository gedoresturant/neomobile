<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neomobile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{font-family:'Cairo',sans-serif}
body{background:#f8fafc}
.center{text-align:center}
@media print{
 body *{visibility:hidden}
 #receiptWrap, #receiptWrap *{visibility:visible}
 #receiptWrap{position:fixed;top:0;right:0;width:80mm;max-width:80mm;margin:0;padding:5mm;background:white;color:black}
 .no-print{display:none!important}
}
.receipt-line{border-top:1px dashed #000;padding:6px 0;margin:4px 0}
.receipt-box{border:1px solid #000;padding:0}
</style>

<style id="redTheme">
:root{--neo-red:#dc2626;--neo-black:#111;}
.bg-black{ background: linear-gradient(135deg,#dc2626,#111) !important; }
.bg-gray-900{ background:#111 !important; }
.from-red-600.to-black{ background: linear-gradient(90deg,#dc2626,#111) !important; }
.btn-red{ background: linear-gradient(135deg,#dc2626,#991b1b) !important; color:white; }
.header-red{ background: linear-gradient(90deg,#111,#dc2626) !important; }
</style>

</head>
<body>
<div id="app"></div>
<div id="receiptWrap" class="hidden fixed inset-0 bg-red-600/50 z-[999] flex items-center justify-center p-4">
 <div id="receipt" class="bg-white receipt-box w-[302px] max-w-[80mm] text-[12px] leading-5 p-3 text-black"></div>
</div>
<script>
const KEY='neo_clean_v2';
let DB = JSON.parse(localStorage.getItem(KEY)||'null') || {
 cats:[
  {id:'iph',n:'آيفون',icon:'📱',subs:['iPhone 15','iPhone 14']},
  {id:'sam',n:'سامسونج',icon:'📱',subs:['S Series','A Series']},
  {id:'acc',n:'اكسسوارات',icon:'🎧',subs:['سماعات','شواحن','جرابات']}
 ],
 inv:[],
 purchases:[],
 sales:[],
 repairs:[],
 users:[
  {id:'admin',u:'admin',p:'admin123',n:'المدير العام',role:'admin',perms:{dash:true,invView:true,invAdd:true,invDel:true,cost:true,priceEdit:true,catM:true,shop:true,salesView:true,salesDel:true,repView:true,repM:true,usersM:true,download:true,loss:true,jard:true},active:true}
 ]
};
let LOGO_KEY='neo_logo'; let logoData=localStorage.getItem(LOGO_KEY)||'';
let cur=JSON.parse(localStorage.getItem(KEY+'_cur')||'null');
let page='dash'; let searchQ=''; let filterCat='all'; let salesFilter={q:'',cat:'all',from:'',to:''};
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function has(p){if(!cur)return false; if(cur.role==='admin')return true; return cur.perms&&cur.perms[p]}
function login(){
 let u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value.trim();
 let f=DB.users.find(x=>x.u===u && x.p===p && x.active);
 if(!f){document.getElementById('le').innerText='اليوزر أو الباسورد غلط';return}
 localStorage.setItem(KEY+'_cur',JSON.stringify(f)); location.reload();
}
function logout(){localStorage.removeItem(KEY+'_cur'); location.reload()}
function go(p){page=p; render()}

function addProduct(){
 let name=document.getElementById('pn').value.trim();
 let cat=document.getElementById('pc').value;
 let sub=document.getElementById('psub').value.trim()||'عام';
 let imei=document.getElementById('pimei').value.trim();
 let qty=parseInt(document.getElementById('pq').value)||0;
 let unitCost=parseFloat(document.getElementById('pbuy').value)||0;
 let supplier=document.getElementById('psup').value.trim();
 let invNo=document.getElementById('pinv').value.trim();
 let defSell=parseFloat(document.getElementById('psell').value)||0;
 if(!name||!imei||qty<=0||unitCost<=0||!supplier){alert('اكمل: اسم الصنف، الباركود، الكمية، سعر الشراء، المورد');return}
 let existing=DB.inv.find(x=>x.imei===imei || (x.name.toLowerCase()===name.toLowerCase() && x.sub.toLowerCase()===sub.toLowerCase()));
 if(existing){
   let oldTotal=existing.qty*existing.avgBuy;
   let newTotal=qty*unitCost;
   let totalQty=existing.qty+qty;
   let newAvg=(oldTotal+newTotal)/totalQty;
   existing.qty=totalQty; existing.avgBuy=newAvg; existing.totalCost=totalQty*newAvg; existing.lastSupplier=supplier;
   DB.purchases.push({id:uid(),productId:existing.id,name,imei,qty,unitCost,totalCost:newTotal,avgAfter:newAvg,supplier,invoiceNo:invNo,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n});
   alert(`تم تحديث: ${name}\nالكمية الجديدة: ${totalQty}\nالمتوسط: ${newAvg.toFixed(2)} ج`);
 }else{
   let id=uid();
   DB.inv.push({id,name,catId:cat,sub,imei,qty,avgBuy:unitCost,totalCost:qty*unitCost,defaultSell:defSell,img:'📱',lastSupplier:supplier});
   DB.purchases.push({id:uid(),productId:id,name,imei,qty,unitCost,totalCost:qty*unitCost,avgAfter:unitCost,supplier,invoiceNo:invNo,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n});
   alert('تمت الإضافة');
 }
 save(); render();
}

function startScan(targetId){
 let inp=document.getElementById(targetId);
 if(!inp){inp=document.getElementById('searchInput');}
 if(inp){inp.focus(); inp.value=''; inp.placeholder='جاهز للمسح - وجه الجهاز...';}
 let t=document.getElementById('toast'); if(t){t.innerText='📷 جاهز للمسح - وجه جهاز الباركود'; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),3000)}
}

function sellModal(id){
 let p=DB.inv.find(x=>x.id===id);
 if(!p)return;
 let html=`
 <div class="fixed inset-0 bg-red-600/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center">
   <div class="text-3xl mb-2">${p.img}</div>
   <div class="font-black">${p.name}</div>
   <div class="text-xs text-gray-400">متاح: ${p.qty} - الشراء: ${has('cost')?p.avgBuy.toFixed(0):'***'}</div>
   <div class="mt-4 space-y-2 text-right">
    <label class="text-sm font-bold">سعر البيع *</label>
    <input id="sellPrice" type="number" placeholder="اكتب سعر البيع" class="w-full border rounded-xl px-3 py-3 text-center text-lg font-black">
    <label class="text-sm font-bold">العميل (اختياري)</label>
    <input id="sellClient" placeholder="اسم العميل" class="w-full border rounded-xl px-3 py-2">
    <input id="sellPhone" placeholder="رقم الهاتف" class="w-full border rounded-xl px-3 py-2">
   </div>
   <div class="flex gap-2 mt-4">
    <button onclick="doSell('${p.id}')" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-black">بيع + إيصال</button>
    <button onclick="render()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold">إلغاء</button>
   </div>
  </div>
 </div>`;
 document.getElementById('app').insertAdjacentHTML('beforeend',html);
 setTimeout(()=>document.getElementById('sellPrice')?.focus(),100);
}

function doSell(id){
 let p=DB.inv.find(x=>x.id===id);
 let price=parseFloat(document.getElementById('sellPrice').value);
 let client=document.getElementById('sellClient').value.trim()||'عميل';
 let phone=document.getElementById('sellPhone').value.trim()||'';
 if(!price||price<=0){alert('اكتب سعر البيع');return}
 if(!has('loss') && price <= p.avgBuy){alert(`لا يمكن البيع بخسارة\nسعر الشراء: ${p.avgBuy.toFixed(0)} ج\nسعر البيع لازم يكون أكبر`);return}
 if(p.qty<=0){alert('الكمية خلصت');return}
 p.qty-=1;
 let saleId=uid();
 DB.sales.push({id:saleId,productId:p.id,name:p.name,imei:p.imei,qty:1,buyCost:p.avgBuy,sellPrice:price,profit:price-p.avgBuy,date:today(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n,client,clientPhone:phone,invoiceNo:saleId.slice(-6).toUpperCase()});
 save();
 showReceipt(DB.sales[DB.sales.length-1]);
 render();
}

function showReceipt(s){
 let r=document.getElementById('receipt');
 r.innerHTML=`
  ${logoData?`<div class="center mb-2"><img src="${logoData}" class="mx-auto max-h-12 max-w-[120px]"></div>`:``}
  <div class="center font-black text-[18px] mb-1">Neomobile</div>
  <div class="receipt-line"></div>
  <div class="flex justify-between"><span>رقم العرض:</span><b>QT-${s.invoiceNo}</b></div>
  <div class="flex justify-between"><span>التاريخ:</span><span>${s.date} ${s.time}</span></div>
  <div class="flex justify-between"><span>العميل:</span><b>${s.client}</b></div>
  <div class="flex justify-between"><span>الهاتف:</span><span>${s.clientPhone||''}</span></div>
  <div class="receipt-line"></div>
  <div class="font-bold">${s.name}</div>
  <div class="text-[10px]">IMEI: ${s.imei}</div>
  <div class="flex justify-between mt-1"><span>الكمية: 1</span><b>${s.sellPrice.toLocaleString()} ج</b></div>
  <div class="receipt-line"></div>
  <div class="flex justify-between font-black text-[14px]"><span>الإجمالي</span><span>${s.sellPrice.toLocaleString()} ج</span></div>
  <div class="receipt-line"></div>
  <div class="center text-[10px]">شكراً لزيارتكم</div>
  <div class="no-print mt-3 space-y-2">
   <button onclick="doDirectPrint()" class="w-full bg-gradient-to-r from-red-600 to-black text-white py-2 rounded-lg font-bold">🖨️ حفظ / طباعة</button>
   <button onclick="shareWA()" class="w-full bg-emerald-500 text-white py-2 rounded-lg font-bold">واتساب</button>
   <button onclick="document.getElementById('receiptWrap').classList.add('hidden')" class="w-full bg-gray-100 py-2 rounded-lg font-bold">إغلاق</button>
   <button onclick="setupPrinter()" class="w-full border py-2 rounded-lg text-xs">⚙️ إعداد الطابعة</button>
  </div>
 `;
 document.getElementById('receiptWrap').classList.remove('hidden');
 window._lastSale=s;
}
function doDirectPrint(){ window.print() }
function shareWA(){
 let s=window._lastSale; if(!s)return;
 let txt=`Neomobile\nرقم: QT-${s.invoiceNo}\nالعميل: ${s.client}\nالصنف: ${s.name}\nIMEI: ${s.imei}\nالسعر: ${s.sellPrice} ج\nشكراً لزيارتكم`;
 window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
function setupPrinter(){alert('إعداد الطابعة الحرارية 80mm:\n\n1- موبايل: نزل تطبيق RawBT من المتجر واربط الطابعة بالبلوتوث\n2- كمبيوتر: خلي الطابعة الافتراضية 80mm وظبط مقاس الورق 80mm x 200mm\n3- دوس حفظ/طباعة واختار الطابعة')}

function exportSales(){
 let rows=filteredSales();
 let csv='التاريخ,الصنف,IMEI,الكمية,سعر الشراء,سعر البيع,الربح,العميل,البائع,رقم الفاتورة\n';
 rows.forEach(s=>{csv+=`${s.date},${s.name},${s.imei},${s.qty},${s.buyCost},${s.sellPrice},${s.profit},${s.client},${s.by},${s.invoiceNo}\n`});
 let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='مبيعات_Neomobile_'+today()+'.csv'; a.click();
}

function filteredSales(){
 let q=salesFilter.q.toLowerCase(); let cat=salesFilter.cat; let from=salesFilter.from; let to=salesFilter.to;
 return DB.sales.filter(s=>{
  if(q && ! (s.name.toLowerCase().includes(q) || s.client.toLowerCase().includes(q) || s.imei.includes(q))) return false;
  if(cat!=='all'){ let prod=DB.inv.find(p=>p.id===s.productId); if(!prod||prod.catId!==cat) return false; }
  if(from && s.date<from) return false;
  if(to && s.date>to) return false;
  return true;
 }).sort((a,b)=>b.date.localeCompare(a.date));
}

function productHistory(id){
 let p=DB.inv.find(x=>x.id===id) || DB.inv.find(x=>x.imei===id);
 if(!p){alert('المنتج غير موجود');return}
 let purchases=DB.purchases.filter(x=>x.productId===p.id || x.imei===p.imei);
 let sales=DB.sales.filter(x=>x.productId===p.id || x.imei===p.imei);
 let html=`
 <div class="fixed inset-0 bg-red-600/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-5 w-full max-w-lg max-h-[80vh] overflow-auto text-center">
   <div class="font-black text-lg">📜 سجل ${p.name}</div>
   <div class="text-xs text-gray-400">${p.imei} - متاح: ${p.qty} - متوسط: ${p.avgBuy.toFixed(0)}</div>
   <div class="mt-4 text-right">
    <div class="font-bold">المشتريات (${purchases.length})</div>
    ${purchases.map(x=>`<div class="border-b py-2 text-xs"><b>${x.date} ${x.time}</b> - كمية: ${x.qty} - شراء: ${x.unitCost} - متوسط بعد: ${x.avgAfter.toFixed(0)} - مورد: ${x.supplier} - فاتورة: ${x.invoiceNo||''}</div>`).join('')||'<div class="text-xs text-gray-400">لا يوجد</div>'}
    <div class="font-bold mt-3">المبيعات (${sales.length})</div>
    ${sales.map(x=>`<div class="border-b py-2 text-xs"><b>${x.date}</b> - عميل: ${x.client} - بيع: ${x.sellPrice} - ربح: ${x.profit.toFixed(0)} - بواسطة: ${x.by}</div>`).join('')||'<div class="text-xs text-gray-400">لا يوجد</div>'}
   </div>
   <button onclick="render()" class="mt-4 w-full bg-gray-100 py-2 rounded-xl font-bold">إغلاق</button>
  </div>
 </div>`;
 document.getElementById('app').insertAdjacentHTML('beforeend',html);
}

function addUser(){
 let n=document.getElementById('un').value.trim();
 let u=document.getElementById('uu').value.trim();
 let p=document.getElementById('up').value.trim();
 let role=document.getElementById('ur').value;
 if(!n||!u||!p){alert('اكمل البيانات');return}
 let perms={};
 document.querySelectorAll('.permChk').forEach(ch=>{perms[ch.dataset.perm]=ch.checked});
 DB.users.push({id:uid(),u,p,n,role,perms,active:true});
 save(); render(); alert('تمت إضافة المستخدم');
}
function editPerms(id){
 let user=DB.users.find(x=>x.id===id); if(!user)return;
 let html=`<div class="fixed inset-0 bg-red-600/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-5 w-full max-w-md max-h-[80vh] overflow-auto text-center">
   <div class="font-black">✏️ تعديل صلاحيات ${user.n}</div>
   <div class="grid grid-cols-2 gap-2 mt-4 text-right text-sm">
    ${Object.keys(user.perms).map(k=>{let m={'dash':'لوحة التحكم','invView':'عرض المخزن','invAdd':'إضافة للمخزن','invDel':'مسح المخزن','cost':'عرض التكلفة','priceEdit':'تعديل السعر','catM':'إدارة الفئات','shop':'نقطة البيع','salesView':'عرض المبيعات','salesDel':'مسح المبيعات','repView':'عرض الصيانة','repM':'إدارة الصيانة','usersM':'إدارة المستخدمين','download':'تحميل النسخة','loss':'البيع بخسارة','jard':'الجرد'}; let l=m[k]||k; return `<label class="flex items-center gap-2 border rounded-xl px-3 py-2 justify-center text-center"><input type="checkbox" data-perm="${k}" ${user.perms[k]?'checked':''} class="editPerm"> ${l}</label>`}).join('')}
   </div>
   <div class="flex gap-2 mt-4">
    <button onclick="savePerms('${id}')" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold">حفظ</button>
    <button onclick="render()" class="flex-1 bg-gray-100 py-2 rounded-xl font-bold">إلغاء</button>
   </div>
  </div>
 </div>`;
 document.getElementById('app').insertAdjacentHTML('beforeend',html);
}
function savePerms(id){
 let user=DB.users.find(x=>x.id===id);
 document.querySelectorAll('.editPerm').forEach(ch=>{user.perms[ch.dataset.perm]=ch.checked});
 save(); render();
}
function changePass(id){
 let np=prompt('الباسورد الجديد:');
 if(!np)return;
 let user=DB.users.find(x=>x.id===id); user.p=np; save(); alert('تم تغيير الباسورد');
}

function uploadLogo(){
 let inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
 inp.onchange=e=>{
  let file=e.target.files[0]; if(!file)return;
  let reader=new FileReader();
  reader.onload=ev=>{
   localStorage.setItem(LOGO_KEY, ev.target.result);
   logoData=ev.target.result;
   alert('تم حفظ اللوجو');
   render();
  };
  reader.readAsDataURL(file);
 };
 inp.click();
}
function removeLogo(){ localStorage.removeItem(LOGO_KEY); logoData=''; alert('تم حذف اللوجو'); render(); }

function showReturn(imei){
 let p=DB.inv.find(x=>x.imei===imei) || DB.inv.find(x=>x.id===imei);
 let purchases=DB.purchases.filter(x=>x.imei===imei || (p && x.productId===p.id));
 let sales=DB.sales.filter(x=>x.imei===imei || (p && x.productId===p.id));
 if(!p && !purchases.length && !sales.length){ alert('المنتج غير موجود'); return; }
 let prodName=p? p.name : (purchases[0]?.name || sales[0]?.name || 'غير معروف');
 let lastPurchase=purchases.length? purchases[purchases.length-1] : null;
 let lastSale=sales.length? sales[sales.length-1] : null;
 let supplier=lastPurchase? lastPurchase.supplier : (p? p.lastSupplier : 'غير معروف');
 let buyPrice=lastPurchase? lastPurchase.unitCost : (p? p.avgBuy : 0);
 let buyDate=lastPurchase? lastPurchase.date : '';
 let sellPrice=lastSale? lastSale.sellPrice : 'لم يباع بعد';
 let sellDate=lastSale? lastSale.date : '';
 
 let htmlModal=`<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-6 w-full max-w-lg text-center shadow-2xl">
   <div class="w-16 h-16 mx-auto mb-3 bg-red-100 rounded-2xl flex items-center justify-center text-2xl">↩️</div>
   <div class="font-black text-xl">مرتجع - تفاصيل المنتج</div>
   <div class="mt-4 space-y-3 text-right bg-gray-50 rounded-2xl p-4">
    <div class="flex justify-between border-b pb-2"><span class="text-gray-500">نوع المنتج</span><b>${prodName}</b></div>
    <div class="flex justify-between border-b pb-2"><span class="text-gray-500">الباركود / IMEI</span><b class="text-xs">${imei}</b></div>
    <div class="flex justify-between border-b pb-2"><span class="text-gray-500">تاريخ الشراء</span><b>${buyDate||'غير مسجل'}</b></div>
    <div class="flex justify-between border-b pb-2"><span class="text-gray-500">سعر الشراء</span><b class="text-red-600">${buyPrice} ج</b></div>
    <div class="flex justify-between border-b pb-2"><span class="text-gray-500">المورد</span><b>${supplier}</b></div>
    <div class="flex justify-between border-b pb-2"><span class="text-gray-500">اتباع بكام</span><b class="text-emerald-600">${sellPrice}${sellPrice!=='لم يباع بعد'?' ج':''}</b></div>
    <div class="flex justify-between"><span class="text-gray-500">تاريخ البيع</span><b>${sellDate||'لم يباع'}</b></div>
   </div>
   <div class="mt-3 text-right">
    <div class="text-xs font-bold mb-1">سجل المشتريات (${purchases.length})</div>
    <div class="max-h-20 overflow-auto text-[11px] bg-white border rounded-xl p-2">${purchases.map(x=>`<div>${x.date} - ${x.qty} x ${x.unitCost} - مورد: ${x.supplier}</div>`).join('')||'لا يوجد'}</div>
    <div class="text-xs font-bold mt-2 mb-1">سجل المبيعات (${sales.length})</div>
    <div class="max-h-20 overflow-auto text-[11px] bg-white border rounded-xl p-2">${sales.map(x=>`<div>${x.date} - عميل: ${x.client} - بيع: ${x.sellPrice} - ربح: ${x.profit}</div>`).join('')||'لم يباع بعد'}</div>
   </div>
   <div class="flex gap-2 mt-4">
    <button onclick="if(confirm('تأكيد إرجاع المنتج للمخزن؟')){let prod=DB.inv.find(x=>x.imei==='${imei}'); if(prod){prod.qty+=1;}else if(p){p.qty+=1;} save(); alert('تم إرجاع المنتج'); render();}else{render()}" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-black">تأكيد الإرجاع للمخزن</button>
    <button onclick="render()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold">إغلاق</button>
   </div>
  </div>
 </div>`;
 document.getElementById('app').insertAdjacentHTML('beforeend',htmlModal);
}

function deleteUser(id){
 if(id==='admin'){alert('لا يمكن مسح الأدمن');return}
 if(!confirm('متأكد تمسح اليوزر؟'))return;
 DB.users=DB.users.filter(x=>x.id!==id); save(); render();
}


function doJard(type){
 let totalQty=DB.inv.reduce((s,x)=>s+x.qty,0);
 let totalVal=DB.inv.reduce((s,x)=>s+x.qty*x.avgBuy,0);
 let hist=JSON.parse(localStorage.getItem('neo_jard')||'[]');
 hist.push({date:today(),time:new Date().toLocaleTimeString('ar-EG'),type,qty:totalQty,value:totalVal,by:cur.n,details:JSON.parse(JSON.stringify(DB.inv))});
 localStorage.setItem('neo_jard',JSON.stringify(hist));
 alert(`تم حفظ الجرد ${type} بنجاح\nالقطع: ${totalQty}\nالقيمة: ${totalVal.toLocaleString()} ج`);
 render();

function exportJard(){
 let hist=JSON.parse(localStorage.getItem('neo_jard')||'[]');
 if(!hist.length){alert('لا يوجد جرد');return}
 let csv='التاريخ,النوع,عدد القطع,قيمة المخزن,بواسطة\n';
 hist.forEach(h=>{csv+=`${h.date} ${h.time},${h.type},${h.qty},${h.value},${h.by}\n`;});
 csv+='\nتفاصيل اخر جرد\nالصنف,الباركود,الكمية,متوسط الشراء,القيمة\n';
 DB.inv.forEach(i=>{csv+=`${i.name},${i.imei},${i.qty},${i.avgBuy},${i.qty*i.avgBuy}\n`;});
 let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='جرد_Neomobile_'+today()+'.csv'; a.click();
}

       ].map(([k,l])=>`<label class="flex items-center gap-2 border rounded-xl px-3 py-2 justify-center text-center"><input type="checkbox" data-perm="${k}" class="permChk" checked> ${l}</label>`).join('')}
      </div>
     </div>
     <button onclick="addUser()" class="w-full mt-3 bg-gradient-to-r from-red-600 to-black text-white py-3 rounded-xl font-black">إضافة مستخدم</button>
    </div>
    <div class="space-y-2">
     ${DB.users.map(u=>`<div class="border rounded-2xl p-3 flex justify-between items-center text-center">
      <div><div class="font-bold">${u.n}</div><div class="text-xs text-gray-400">${u.u} - ${u.role} - ${u.active?'نشط':'موقف'}</div></div>
      <div class="flex gap-1">
       <button onclick="editPerms('${u.id}')" class="bg-gray-100 px-2 py-1 rounded-lg text-xs">✏️ صلاحيات</button>
       <button onclick="changePass('${u.id}')" class="bg-gray-100 px-2 py-1 rounded-lg text-xs">🔑 باسورد</button>
       <button onclick="deleteUser('${u.id}')" class="bg-red-50 text-red-600 px-2 py-1 rounded-lg text-xs">🗑️ مسح</button>
      </div>
     </div>`).join('')}
    </div>
   </div>
  </div>`;
 }
 else if(page==='cats'){
  content=`<div class="max-w-6xl mx-auto p-4"><div class="bg-white rounded-3xl p-5 shadow-sm text-center"><h3 class="font-black mb-4">الفئات</h3><div class="flex gap-2 justify-center mb-4"><input id="cn" placeholder="اسم الفئة" class="border rounded-xl px-3 py-2 text-center"><button onclick="addCat()" class="bg-gradient-to-r from-red-600 to-black text-white px-4 py-2 rounded-xl">إضافة</button></div><div class="space-y-2">${DB.cats.map(c=>`<div class="border rounded-xl p-3 flex justify-between"><span>${c.icon} ${c.n}</span><button onclick="delCat('${c.id}')" class="text-red-500 text-xs">مسح</button></div>`).join('')}</div></div></div>`;
 }
 app.innerHTML=menu+content+toast;
}

function addCat(){let n=document.getElementById('cn').value.trim(); if(!n)return; DB.cats.push({id:uid(),n,icon:'📱',subs:[]}); save(); render()}
function delCat(id){if(!confirm('مسح الفئة؟'))return; DB.cats=DB.cats.filter(x=>x.id!==id); save(); render()}
function addRepair(){
 let c=document.getElementById('rc').value.trim(), p=document.getElementById('rp').value.trim(), d=document.getElementById('rd').value.trim(), f=document.getElementById('rf').value.trim(), cost=document.getElementById('rcost').value;
 if(!c||!p||!d||!f){alert('اكمل البيانات');return}
 DB.repairs.push({id:uid(),client:c,phone:p,device:d,fault:f,cost:cost||0,status:'قيد الصيانة',date:today()}); save(); render();
}
function updateRep(id){let s=prompt('الحالة الجديدة: قيد الصيانة، تم الإصلاح، تم التسليم'); if(!s)return; let r=DB.repairs.find(x=>x.id===id); r.status=s; save(); render()}
function delRep(id){if(!confirm('مسح؟'))return; DB.repairs=DB.repairs.filter(x=>x.id!==id); save(); render()}

render();
</script>
</body>
</html>
