<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONETOUCH</title>
<style>
*{font-family:'Segoe UI',Tahoma,Arial,sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#f3f4f6;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#022c22,#059669);padding:16px}
.login-card{background:#fff;border-radius:24px;padding:32px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card h1{text-align:center;font-size:36px;letter-spacing:6px;font-weight:900}
.login-card p{text-align:center;color:#9ca3af;font-size:13px;margin:4px 0 20px}
.inp{width:100%;height:48px;border:1.5px solid #e5e7eb;border-radius:12px;padding:0 14px;margin-bottom:12px;font-size:15px;outline:none}
.inp:focus{border-color:#059669}
.btn{width:100%;height:48px;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}
.btn-green{background:#059669;color:#fff}
.btn-dark{background:#111827;color:#fff}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:#fff;border-left:1px solid #e5e7eb;padding:16px;flex-shrink:0}
.side h2{font-size:20px;letter-spacing:3px}
.side .who{font-size:11px;color:#9ca3af;margin-bottom:12px}
.navbtn{display:block;width:100%;text-align:right;padding:10px 12px;border:none;background:none;border-radius:10px;margin-bottom:4px;font-size:14px;cursor:pointer;color:#374151}
.navbtn.on{background:#059669;color:#fff;font-weight:700}
.main{flex:1;min-width:0}
.top{height:56px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0}
.content{padding:16px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:768px){.grid4{grid-template-columns:1fr 1fr}.side{display:none}.mobilenav{display:flex!important}}
.mobilenav{display:none;background:#fff;border-bottom:1px solid #e5e7eb;padding:8px;gap:8px;overflow-x:auto}
.mobilenav button{white-space:nowrap;border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer}
.mobilenav button.on{background:#059669;color:#fff;border-color:#059669}
.stat{border-radius:18px;padding:18px}
.stat .t{font-size:12px;opacity:.85}
.stat .v{font-size:26px;font-weight:900;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
table td,table th{padding:10px 6px;border-bottom:1px solid #f3f4f6;text-align:right}
.shopcats{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.shopcats button{flex-shrink:0;border:none;padding:12px 20px;border-radius:16px;font-weight:800;font-size:14px;cursor:pointer;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.shopcats button.on{background:#059669;color:#fff}
.prods{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:768px){.prods{grid-template-columns:repeat(4,1fr)}}
.prod{background:#fff;border-radius:20px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.prod .em{font-size:44px}
.prod .nm{font-weight:800;font-size:13px;margin:6px 0}
.prod .pr{color:#059669;font-weight:900;font-size:18px;margin:6px 0}
.sellbtn{background:linear-gradient(90deg,#059669,#0d9488);color:#fff;border:none;border-radius:14px;padding:10px;width:100%;font-weight:800;cursor:pointer;margin-top:6px}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px}
.err{color:#dc2626;font-size:13px;text-align:center;min-height:20px;margin-bottom:6px}
@media print{.noprint{display:none!important}}
#receipt{display:none}
@media print{#receipt{display:block!important}.layout{display:none!important}}
</style>

<body>
<div id="app"></div>
<div id="receipt"></div>
<script>
var DB_KEY='ot_final_v1';
var USERS_KEY='ot_final_users';
var CUR_KEY='ot_final_cur';
var defaultDB={
 cats:[
  {id:'iph',n:'آيفون'},
  {id:'sam',n:'سامسونج'},
  {id:'oppo',n:'اوبو / شاومي'},
  {id:'acc',n:'اكسسوارات'}
 ],
 inv:[
  {id:1,name:'iPhone 15 Pro Max 256GB',catId:'iph',sub:'iPhone 15',imei:'352756108984321',qty:4,buy:52000,sell:58500,em:'📱'},
  {id:2,name:'Samsung S24 Ultra',catId:'sam',sub:'S Series',imei:'353911087654322',qty:5,buy:48000,sell:54000,em:'📱'},
  {id:3,name:'Oppo Reno 10',catId:'oppo',sub:'اوبو',imei:'358890123456785',qty:6,buy:12500,sell:14900,em:'📱'},
  {id:4,name:'AirPods Pro 2',catId:'acc',sub:'سماعات ايربودز',imei:'ACC-001',qty:20,buy:3200,sell:4100,em:'🎧'},
  {id:5,name:'شاحن سريع 67W',catId:'acc',sub:'شواحن',imei:'ACC-002',qty:30,buy:280,sell:450,em:'🔌'},
  {id:6,name:'باور بنك 20000',catId:'acc',sub:'باور بنك',imei:'ACC-003',qty:15,buy:650,sell:950,em:'🔋'}
 ],
 sales:[],
 repairs:[
  {id:101,client:'احمد محمد',phone:'01001234567',device:'iPhone 13',fault:'شاشة مكسورة',status:'قيد الصيانة',cost:0,date:'2026-10-01'}
 ],
 backups:[]
};
var DB;
try{DB=JSON.parse(localStorage.getItem(DB_KEY))||JSON.parse(JSON.stringify(defaultDB));}catch(e){DB=JSON.parse(JSON.stringify(defaultDB));}
var USERS;
try{USERS=JSON.parse(localStorage.getItem(USERS_KEY))||[
 {u:'admin',p:'admin123',n:'المدير العام',r:'admin'},
 {u:'store',p:'store123',n:'مسؤول المخزن',r:'store'},
 {u:'sales',p:'sales123',n:'موظف المبيعات',r:'sales'},
 {u:'maint',p:'maint123',n:'فني الصيانة',r:'maintenance'}
];}catch(e){USERS=[
 {u:'admin',p:'admin123',n:'المدير العام',r:'admin'},
 {u:'store',p:'store123',n:'مسؤول المخزن',r:'store'},
 {u:'sales',p:'sales123',n:'موظف المبيعات',r:'sales'},
 {u:'maint',p:'maint123',n:'فني الصيانة',r:'maintenance'}
];}
var cur=null;
try{cur=JSON.parse(localStorage.getItem(CUR_KEY));}catch(e){}
var page='dash';
var shopCat='all';
function save(){localStorage.setItem(DB_KEY,JSON.stringify(DB));doBackup();}
function saveUsers(){localStorage.setItem(USERS_KEY,JSON.stringify(USERS));}
function doBackup(){try{DB.backups.push({ts:new Date().toISOString(),data:JSON.stringify({inv:DB.inv,sales:DB.sales,repairs:DB.repairs,cats:DB.cats})});if(DB.backups.length>20)DB.backups=DB.backups.slice(-20);localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
function todayStr(){return new Date().toISOString().slice(0,10);}
function isAdmin(){return cur&&cur.r==='admin';}
function esc(s){return String(s==null?'':s).replace(/</g,'&lt;');}
function login(){
 var u=document.getElementById('lu').value.trim();
 var p=document.getElementById('lp').value.trim();
 var f=null;
 for(var i=0;i<USERS.length;i++){if(USERS[i].u===u&&USERS[i].p===p){f=USERS[i];break;}}
 if(!f){document.getElementById('le').innerHTML='اليوزر او الباسورد غلط';return;}
 localStorage.setItem(CUR_KEY,JSON.stringify(f));
 location.reload();
}
function logout(){localStorage.removeItem(CUR_KEY);location.reload();}
function go(p){page=p;render();window.scrollTo(0,0);}
function catName(id){for(var i=0;i<DB.cats.length;i++)if(DB.cats[i].id===id)return DB.cats[i].n;return '';}
function printHTML(h){var r=document.getElementById('receipt');r.innerHTML=h;window.print();}
function saleRc(s){
 return '<div style="max-width:300px;margin:auto;border:2px dashed #000;padding:14px;font-family:Arial">'
 +'<h3 style="text-align:center">ONETOUCH</h3>'
 +'<p style="text-align:center;font-size:12px">فاتورة بيع - '+esc(s.date)+' '+esc(s.time)+'</p><hr>'
 +'<p>العميل: '+esc(s.client||'نقدي')+'</p><p>الصنف: '+esc(s.name)+'</p><p>IMEI: '+esc(s.imei)+'</p>'
 +'<p>السعر: <b>'+s.sell+' جنيه</b></p><p>البائع: '+esc(s.by)+'</p><hr>'
 +'<p style="text-align:center;font-size:11px">شكرا لتعاملكم مع ONETOUCH</p></div>';
}
function repRc(r){
 return '<div style="max-width:300px;margin:auto;border:2px dashed #000;padding:14px;font-family:Arial">'
 +'<h3 style="text-align:center">ONETOUCH - صيانة</h3>'
 +'<p style="text-align:center;font-size:12px">'+esc(r.date)+'</p><hr>'
 +'<p>الاسم: '+esc(r.client)+'</p><p>تليفون: '+esc(r.phone)+'</p><p>الجهاز: '+esc(r.device)+'</p><p>العطل: '+esc(r.fault)+'</p>'
 +'<p>التكلفة: <b>'+r.cost+' جنيه</b></p><hr>'
 +'<p style="text-align:center;font-size:11px">احتفظ بالايصال للاستلام</p></div>';
}
function doSell(id){
 var it=null;
 for(var i=0;i<DB.inv.length;i++)if(DB.inv[i].id===id)it=DB.inv[i];
 if(!it||it.qty<=0){alert('غير متاح');return;}
 var client=prompt('اسم العميل (اختياري):')||'نقدي';
 it.qty--;
 var s={id:Date.now(),name:it.name,imei:it.imei,sell:it.sell,buy:it.buy,date:todayStr(),time:new Date().toLocaleTimeString('ar-EG'),by:cur.n,client:client};
 DB.sales.push(s);save();
 printHTML(saleRc(s));
 render();
}
function addProduct(){
 var n=document.getElementById('pn').value.trim();
 var c=document.getElementById('pc').value;
 var sb=document.getElementById('psb').value.trim();
 var im=document.getElementById('pi').value.trim();
 var q=parseInt(document.getElementById('pq').value)||1;
 var b=parseInt(document.getElementById('pb').value)||0;
 var s=parseInt(document.getElementById('ps').value)||0;
 if(!n||!im){alert('اكمل الاسم و IMEI');return;}
 DB.inv.push({id:Date.now(),name:n,catId:c,sub:sb||catName(c),imei:im,qty:q,buy:b,sell:s,em:(c==='acc'?'🎧':'📱')});
 save();alert('تمت الاضافة');render();go('inv');
}
function delProduct(id){
 if(!isAdmin()){alert('المسح للادمن فقط');return;}
 if(!confirm('مسح الصنف؟'))return;
 DB.inv=DB.inv.filter(function(x){return x.id!==id;});
 save();render();
}
function addRepair(){
 var c=document.getElementById('rc').value.trim();
 var p=document.getElementById('rp').value.trim();
 var d=document.getElementById('rd').value.trim();
 var f=document.getElementById('rf').value.trim();
 if(!c||!p||!d){alert('اكمل البيانات');return;}
 var r={id:Date.now(),client:c,phone:p,device:d,fault:f,status:'قيد الصيانة',cost:0,date:todayStr()};
 DB.repairs.push(r);save();
 printHTML(repRc(r));
 render();go('rep');
}
function finishRepair(id){
 var cost=parseInt(document.getElementById('cost_'+id).value)||0;
 for(var i=0;i<DB.repairs.length;i++)if(DB.repairs[i].id===id){DB.repairs[i].cost=cost;DB.repairs[i].status='تم الاصلاح - جاهز';printHTML(repRc(DB.repairs[i]));}
 save();alert('تم - ظهر للادمن ان الجهاز جاهز');render();
}
function deliverRepair(id){
 for(var i=0;i<DB.repairs.length;i++)if(DB.repairs[i].id===id){DB.repairs[i].status='تم التسليم';printHTML(repRc(DB.repairs[i]));}
 save();render();
}
function addUser(){
 var n=document.getElementById('un').value.trim();
 var u=document.getElementById('uu').value.trim();
 var p=document.getElementById('up').value.trim();
 var r=document.getElementById('ur').value;
 if(!n||!u||!p){alert('اكمل البيانات');return;}
 USERS.push({u:u,p:p,n:n,r:r});saveUsers();alert('تمت اضافة الموظف');render();
}
function changePw(i){
 var np=prompt('الباسورد الجديد:');
 if(!np)return;
 USERS[i].p=np.trim();saveUsers();alert('تم تغيير الباسورد');render();
}
function delUser(i){
 if(!confirm('مسح الموظف؟'))return;
 USERS.splice(i,1);saveUsers();render();
}
function delSelSales(){
 var boxes=document.querySelectorAll('.sChk:checked');
 if(!boxes.length){alert('اختار اولا');return;}
 if(!confirm('مسح المحدد؟'))return;
 var ids=[];for(var i=0;i<boxes.length;i++)ids.push(parseInt(boxes[i].value));
 DB.sales=DB.sales.filter(function(s){return ids.indexOf(s.id)<0;});
 save();render();go('salesmg');
}
function delAllSales(){
 if(!confirm('مسح كل مبيعات اليوم؟'))return;
 DB.sales=DB.sales.filter(function(s){return s.date!==todayStr();});
 save();render();go('salesmg');
}
function restBk(i){
 if(!confirm('استرجاع هذه النسخة؟'))return;
 var d=JSON.parse(DB.backups[i].data);
 DB.inv=d.inv;DB.sales=d.sales;DB.repairs=d.repairs;DB.cats=d.cats;
 save();alert('تم الاسترجاع');render();go('dash');
}
function expJ(){
 var b=new Blob([JSON.stringify(DB)],{type:'application/json'});
 var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='onetouch-'+todayStr()+'.json';a.click();
}
function impJ(e){
 var f=e.target.files[0];var r=new FileReader();
 r.onload=function(){try{if(confirm('استرجاع النسخة؟')){DB=JSON.parse(r.result);save();location.reload();}}catch(err){alert('ملف غير صالح');}};
 r.readAsText(f);
}
var roleNames={admin:'مدير عام',store:'مخزن',sales:'مبيعات',maintenance:'صيانة'};
function navHTML(){
 var h='';
 h+='<button class="navbtn'+(page==='dash'?' on':'')+'" onclick="go('dash')">🏠 الرئيسية</button>';
 if(cur.r==='sales'||isAdmin())h+='<button class="navbtn'+(page==='shop'?' on':'')+'" onclick="go('shop')">🛍️ واجهة البيع</button>';
 if(cur.r==='store'||isAdmin())h+='<button class="navbtn'+(page==='inv'?' on':'')+'" onclick="go('inv')">📦 المخزن</button>';
 if(cur.r==='maintenance'||isAdmin())h+='<button class="navbtn'+(page==='rep'?' on':'')+'" onclick="go('rep')">🔧 الصيانة</button>';
 if(isAdmin()){
  h+='<button class="navbtn'+(page==='salesmg'?' on':'')+'" onclick="go('salesmg')">🧾 مبيعات اليوم</button>';
  h+='<button class="navbtn'+(page==='backup'?' on':'')+'" onclick="go('backup')">☁️ النسخ الاحتياطي</button>';
  h+='<button class="navbtn'+(page==='users'?' on':'')+'" onclick="go('users')">👥 الموظفين</button>';
 }
 return h;
}
function render(){
 var app=document.getElementById('app');
 if(!cur){
  app.innerHTML='<div class="login-wrap"><div class="login-card">'
  +'<h1>ONETOUCH</h1><p>نظام ادارة المحل</p>'
  +'<input id="lu" class="inp" placeholder="اسم المستخدم">'
  +'<input id="lp" type="password" class="inp" placeholder="كلمة المرور" onkeypress="if(event.key==='Enter')login()">'
  +'<div id="le" class="err"></div>'
  +'<button class="btn btn-green" onclick="login()">تسجيل الدخول</button>'
  +'</div></div>';
  return;
 }
 if(page==='dash'&&!isAdmin()){
  page=(cur.r==='sales')?'shop':(cur.r==='store')?'inv':(cur.r==='maintenance')?'rep':'shop';
 }
 var nav=navHTML();
 var c='';
 if(page==='dash'&&isAdmin()){
  var ts=DB.sales.filter(function(s){return s.date===todayStr();});
  var totalBuy=0;for(var i=0;i<DB.inv.length;i++)totalBuy+=DB.inv[i].qty*DB.inv[i].buy;
  var soldVal=0,soldCost=0;for(var j=0;j<DB.sales.length;j++){soldVal+=DB.sales[j].sell;soldCost+=(DB.sales[j].buy||0);}
  var profit=soldVal-soldCost;
  var margin=soldVal?Math.round(profit/soldVal*100):0;
  var per={};
  for(var k=0;k<DB.sales.length;k++){var sn=DB.sales[k].name;if(!per[sn])per[sn]={n:0,p:0,r:0};per[sn].n++;per[sn].p+=(DB.sales[k].sell-(DB.sales[k].buy||0));per[sn].r+=DB.sales[k].sell;}
  var arr=[];for(var key in per)arr.push([key,per[key]]);
  arr.sort(function(a,b){return b[1].n-a[1].n;});
  var top=arr[0];
  c+='<h2 style="font-weight:900;font-size:20px;margin-bottom:12px">📊 النظام المحاسبي الكامل</h2>';
  c+='<div class="grid4">'
  +'<div class="card stat" style="background:linear-gradient(135deg,#059669,#0d9488);color:#fff"><div class="t">💰 صافي الربح</div><div class="v">'+profit.toLocaleString()+' ج</div><div style="font-size:11px">هامش '+margin+'%</div></div>'
  +'<div class="card stat"><div class="t">🛒 البضاعة المباعة</div><div class="v" style="font-size:20px">'+soldVal.toLocaleString()+' ج</div><div style="font-size:11px;color:#9ca3af">التكلفة '+soldCost.toLocaleString()+'</div></div>'
  +'<div class="card stat"><div class="t">📦 تكلفة المخزون الحالي</div><div class="v" style="font-size:20px">'+totalBuy.toLocaleString()+' ج</div><div style="font-size:11px;color:#9ca3af">'+DB.inv.length+' صنف</div></div>'
  +'<div class="card stat" style="background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff"><div class="t">🔥 الاعلى طلبا</div><div style="font-weight:900;margin-top:4px">'+(top?esc(top[0]):'لا يوجد')+'</div><div style="font-size:11px">'+(top?top[1].n+' عملية':'')+'</div></div>'
  +'</div>';
  c+='<div class="card"><b>📋 الربح لكل صنف</b><div style="overflow-x:auto;margin-top:10px"><table><tr style="color:#9ca3af;font-size:11px"><td>الصنف</td><td>مبيعات</td><td>الايراد</td><td>الربح</td><td>الهامش</td></tr>';
  if(!arr.length)c+='<tr><td colspan="5" style="text-align:center;color:#d1d5db">لا توجد مبيعات بعد</td></tr>';
  for(var a=0;a<arr.length;a++){var d=arr[a][1];var m=d.r?Math.round(d.p/d.r*100):0;
   c+='<tr><td><b>'+(a===0?'🔥 ':'')+esc(arr[a][0])+'</b></td><td>'+d.n+'</td><td>'+d.r.toLocaleString()+'</td><td style="color:#059669;font-weight:900">'+d.p.toLocaleString()+'</td><td>'+m+'%</td></tr>';}
  c+='</table></div></div>';
  c+='<div class="card"><b>مبيعات اليوم: '+ts.length+'</b><div style="font-size:12px;color:#9ca3af;margin-top:6px">اجهزة قيد الصيانة: '+DB.repairs.filter(function(r){return r.status!=='تم التسليم';}).length+'</div></div>';
 }
 else if(page==='shop'){
  c+='<h2 style="font-weight:900;font-size:20px;margin-bottom:4px">🛍️ واجهة البيع</h2><p style="font-size:12px;color:#9ca3af;margin-bottom:12px">اختار القسم ودوس بيع - الريسيت بيطلع تلقائيا</p>';
  c+='<div class="shopcats noprint"><button class="'+(shopCat==='all'?'on':'')+'" onclick="shopCat='all';render()">🌟 الكل</button>';
  for(var ci=0;ci<DB.cats.length;ci++){c+='<button class="'+(shopCat===DB.cats[ci].id?'on':'')+'" onclick="shopCat=''+DB.cats[ci].id+'';render()">'+esc(DB.cats[ci].n)+'</button>';}
  c+='</div><div class="prods">';
  var found=0;
  for(var pi=0;pi<DB.inv.length;pi++){var it=DB.inv[pi];if(shopCat!=='all'&&it.catId!==shopCat)continue;found++;
   c+='<div class="prod"><div class="em">'+it.em+'</div><div class="nm">'+esc(it.name)+'</div>'
   +'<div style="font-size:11px;color:#9ca3af">'+esc(it.sub)+' - متاح '+it.qty+'</div>'
   +'<div class="pr">'+it.sell.toLocaleString()+' ج</div>'
