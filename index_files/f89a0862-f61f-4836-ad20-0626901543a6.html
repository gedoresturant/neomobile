<script>
const DB_KEY='ot_v2_db';
let DB = JSON.parse(localStorage.getItem(DB_KEY)||'null') || {
 cats:[
  {id:'iph',n:'📱 آيفون',icon:'📱',subs:['iPhone 15','iPhone 14','iPhone 13']},

  {id:'oppo',n:'📱 أوبو / ريلمي / شاومي',icon:'📱',subs:['شاومي','أوبو','ريلمي']},

 ],
 inv:[
  {id:1,name:'iPhone 15 Pro Max 256GB',catId:'iph',sub:'iPhone 15',imei:'352756108984321',qty:4,buy:52000,sell:58500,img:'📱'},
  {id:2,name:'iPhone 14 128GB',catId:'iph',sub:'iPhone 14',imei:'352756108984322',qty:3,buy:38000,sell:43000,img:'📱'},
  {id:3,name:'Samsung S24 Ultra',catId:'sam',sub:'S Series',imei:'353911087654322',qty:5,buy:48000,sell:54000,img:'📱'},
  {id:4,name:'Oppo Reno 10 5G',catId:'oppo',sub:'أوبو',imei:'358890123456785',qty:6,buy:12500,sell:14900,img:'📱'},
  {id:5,name:'AirPods Pro 2',catId:'acc',sub:'سماعات ايربودز',imei:'ACC-001',qty:20,buy:3200,sell:4100,img:'🎧'},
  {id:6,name:'شاحن سريع 67W',catId:'acc',sub:'شواحن',imei:'ACC-002',qty:30,buy:280,sell:450,img:'🔌'},
  {id:7,name:'باور بنك 20000mAh',catId:'acc',sub:'باور بنك',imei:'ACC-003',qty:15,buy:650,sell:950,img:'🔋'},
  {id:8,name:'جراب سيليكون',catId:'acc',sub:'جرابات',imei:'ACC-004',qty:50,buy:45,sell:120,img:'🛡️'}
 ],
 sales:[], repairs:[
  {id:101,client:'أحمد محمد',phone:'01001234567',device:'iPhone 13',fault:'شاشة مكسورة',status:'قيد الصيانة',cost:0,date:'2026-10-01'},
  {id:102,client:'سارة علي',phone:'01112345678',device:'Samsung A32',fault:'سوكت شحن',status:'قيد الصيانة',cost:0,date:'2026-10-01'}
 ],
 backups:[]
};
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); pushBackup(); }
function pushBackup(){ DB.backups.push({ts:new Date().toISOString(),data:JSON.stringify({inv:DB.inv,sales:DB.sales,repairs:DB.repairs,cats:DB.cats})}); if(DB.backups.length>20) DB.backups=DB.backups.slice(-20); localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
const USERS=[
 {u:'admin',p:'admin123',n:'المدير العام',r:'admin'},
 {u:'store',p:'store123',n:'مسؤول المخزن',r:'store'},
 {u:'sales',p:'sales123',n:'موظف المبيعات',r:'sales'},
 {u:'maint',p:'maint123',n:'فني الصيانة',r:'maintenance'}
];
let cur=JSON.parse(localStorage.getItem('ot_v2_cur')||'null'); let page='dash'; let salesCat='all'; let cart=[];
function login(){let u=document.getElementById('a').value.trim(),p=document.getElementById('b').value.trim();let f=USERS.find(x=>x.u===u&&x.p===p);if(!f){document.getElementById('e').innerText='اليوزر أو الباسورد غلط';return;}localStorage.setItem('ot_v2_cur',JSON.stringify(f));location.reload();}
function out(){localStorage.removeItem('ot_v2_cur');location.reload();}
function go(p){page=p;R();}
function todayStr(){return new Date().toISOString().slice(0,10);}
function isAdmin(){return cur.r==='admin';}
function canDeleteInv(){return cur.r==='admin';}
function canAddInv(){return cur.r==='admin'||cur.r==='store';}

function printReceipt(html){
 let r=document.getElementById('receipt');
 r.innerHTML = html + `<div class="no-print mt-6 flex flex-col gap-2">
   <button onclick="doPrint()" id="printBtn" style="background:#059669;color:#fff;padding:14px 24px;border-radius:12px;font-weight:bold;border:none;cursor:pointer;font-size:15px;width:100%">🖨️ اضغط هنا للطباعة - اختيار الطابعة</button>
   <button onclick="shareReceipt()" style="background:#25D366;color:#fff;padding:12px 24px;border-radius:12px;font-weight:bold;border:none;cursor:pointer;font-size:14px;width:100%">📤 مشاركة واتساب / حفظ</button>
   <button onclick="document.getElementById('receipt').classList.add('hidden')" style="background:#e5e7eb;color:#111;padding:12px 24px;border-radius:12px;font-weight:bold;border:none;cursor:pointer;font-size:14px;width:100%">✖️ إغلاق</button>
 </div>`;
 r.classList.remove('hidden');
 r.scrollIntoView({behavior:'smooth'});
 // try auto print after small delay for desktop
 setTimeout(function(){ 
   if(window.innerWidth > 768){ 
     try{ window.print(); }catch(e){} 
   }
 }, 300);
}
function doPrint(){
  try{
    // Method 1: try window.print directly (works on desktop Chrome)
    window.print();
  }catch(e){
    console.log('print failed', e);
  }
  // Method 2: open in new window as fallback (works on mobile if popup allowed)
  setTimeout(function(){
    try{
      var receiptContent = document.getElementById('receipt').innerHTML;
      // remove buttons from print version
      var tempDiv = document.createElement('div');
      tempDiv.innerHTML = receiptContent;
      var noPrintEls = tempDiv.querySelectorAll('.no-print');
      noPrintEls.forEach(function(el){ el.remove(); });
      var cleanHtml = tempDiv.innerHTML;
      
      var w = window.open('', '_blank');
      if(w){
        w.document.write('<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONETOUCH - فاتورة</title><style>@import url(\"https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap"); *{font-family:Cairo,sans-serif} body{padding:20px} @media print{ body{padding:0} }</style></head><body>' + cleanHtml + '<script>setTimeout(function(){window.print();},500);<\/script></body></html>');
        w.document.close();
      } else {
        alert('المتصفح منع فتح نافذة الطباعة - استخدم مشاركة واتساب أو خد سكرين شوت');
      }
    }catch(e2){
      console.log('popup failed', e2);
      alert('جرب مشاركة واتساب أو خد سكرين شوت للريسيت');
    }
  }, 100);
}
function shareReceipt(){
  try{
    var receiptEl = document.getElementById('receipt');
    var text = receiptEl.innerText || receiptEl.textContent;
    // clean text
    text = text.replace(/اضغط هنا للطباعة[\s\S]*/g, '').trim();
    if(navigator.share){
      navigator.share({title:'ONETOUCH - فاتورة', text:text}).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){ alert('✅ تم نسخ الريسيت - الصقه في واتساب'); }).catch(function(){
        // fallback
        var w = window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
      });
    } else {
      var w = window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
      if(!w){
        alert(text);
      }
    }
  }catch(e){
    alert('خد سكرين شوت للريسيت');
  }
}

function saleReceipt(sale){
 return `<div style="font-family:Cairo;max-width:320px;margin:auto;border:2px dashed #000;padding:16px">
 <h2 style="text-align:center">ONETOUCH</h2><p style="text-align:center;font-size:12px">فاتورة بيع - ${sale.date} ${sale.time}</p><hr>
 <p>العميل: ${sale.client||'عميل نقدي'}</p><p>الصنف: ${sale.name}</p><p>IMEI: ${sale.imei}</p>
 <p>السعر: <b>${sale.sell} جنيه</b></p><p>البائع: ${sale.by}</p><hr>
 <p style="text-align:center;font-size:12px">شكرا لتعاملكم مع ONETOUCH<br>ضمان ساري حسب سياسة المحل</p></div>`;
}
function repairReceipt(rp){
 return `<div style="font-family:Cairo;max-width:320px;margin:auto;border:2px dashed #000;padding:16px">
 <h2 style="text-align:center">ONETOUCH - صيانة</h2><p style="text-align:center;font-size:12px">إيصال استلام / تسليم - ${rp.date}</p><hr>
 <p>الاسم: ${rp.client}</p><p>تليفون: ${rp.phone}</p><p>الجهاز: ${rp.device}</p><p>العطل: ${rp.fault}</p>
 <p>الحالة: ${rp.status}</p><p>التكلفة: <b>${rp.cost} جنيه</b></p><hr>
 <p style="text-align:center;font-size:12px">احتفظ بالإيصال لاستلام جهازك</p></div>`;
}

function R(){
let el=document.getElementById('r');
if(!cur){ el.innerHTML=`<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-emerald-900 to-teal-800 p-4"><div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-[360px]"><h1 class="text-4xl font-black text-center tracking-widest mb-1">ONETOUCH</h1><p class="text-center text-gray-400 text-sm mb-6">نظام إدارة المحل</p><input id="a" placeholder="اسم المستخدم" class="w-full h-12 border rounded-xl px-4 mb-3 outline-none focus:border-emerald-500"><input id="b" type="password" placeholder="كلمة المرور" class="w-full h-12 border rounded-xl px-4 mb-3 outline-none focus:border-emerald-500" onkeypress="if(event.key==='Enter')login()"><div id="e" class="text-red-500 text-sm text-center mb-2 h-5"></div><button onclick="login()" class="w-full h-12 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-lg">تسجيل الدخول</button></div></div>`; return;}
let rl={admin:'مدير عام 👑',store:'مخزن 📦',sales:'مبيعات 🛒',maintenance:'صيانة 🔧'}[cur.r];
let menu='';
menu+=`<button onclick="go('dash')" class="block w-full text-right px-3 py-2.5 rounded-xl mb-1 ${page==='dash'?'bg-emerald-600 text-white shadow':'hover:bg-gray-100'}">🏠 الرئيسية</button>`;
if(cur.r==='sales'||isAdmin()) menu+=`<button onclick="go('shop')" class="block w-full text-right px-3 py-2.5 rounded-xl mb-1 ${page==='shop'?'bg-emerald-600 text-white shadow':'hover:bg-gray-100'}">🛍️ واجهة البيع</button>`;
if(cur.r==='store'||isAdmin()) menu+=`<button onclick="go('inv')" class="block w-full text-right px-3 py-2.5 rounded-xl mb-1 ${page==='inv'?'bg-emerald-600 text-white shadow':'hover:bg-gray-100'}">📦 المخزن</button>`;
if(cur.r==='maintenance'||isAdmin()) menu+=`<button onclick="go('rep')" class="block w-full text-right px-3 py-2.5 rounded-xl mb-1 ${page==='rep'?'bg-emerald-600 text-white shadow':'hover:bg-gray-100'}">🔧 الصيانة</button>`;
if(isAdmin()){ menu+=`<button onclick="go('sales_mgmt')" class="block w-full text-right px-3 py-2.5 rounded-xl mb-1 ${page==='sales_mgmt'?'bg-emerald-600 text-white':'hover:bg-gray-100'}">🧾 مبيعات اليوم</button>`; menu+=`<button onclick="go('backup')" class="block w-full text-right px-3 py-2.5 rounded-xl mb-1 ${page==='backup'?'bg-emerald-600 text-white':'hover:bg-gray-100'}">☁️ النسخ الاحتياطي</button>`; menu+=`<button onclick="go('users')" class="block w-full text-right px-3 py-2.5 rounded-xl mb-1 ${page==='users'?'bg-emerald-600 text-white':'hover:bg-gray-100'}">👥 المستخدمين</button>`;}

el.innerHTML=`<div class="flex min-h-screen">
<aside class="w-64 bg-white border-l p-4 hidden md:block shrink-0 shadow-sm"><h2 class="font-black text-2xl tracking-wider">ONETOUCH</h2><p class="text-xs text-gray-400 mb-4">${cur.n} - ${rl}</p><nav class="text-sm">${menu}</nav></aside>
<main class="flex-1 min-w-0"><header class="h-14 bg-white/90 backdrop-blur border-b flex justify-between items-center px-4 sticky top-0 z-10 no-print"><b class="tracking-widest">ONETOUCH</b><div class="flex gap-2 items-center text-sm"><span class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">${rl}</span><button onclick="out()" class="bg-red-50 text-red-600 px-3 py-1 rounded-lg text-sm">خروج</button></div></header>
<div class="md:hidden bg-white border-b p-2 flex gap-2 overflow-x-auto text-xs no-print whitespace-nowrap">${menu}</div>
<div id="c" class="p-4 max-w-7xl mx-auto"></div></main></div>`;
let c=document.getElementById('c');

// ===== DASHBOARD =====
if(page==='dash'){
 let ts=DB.sales.filter(s=>s.date===todayStr());
 c.innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
 <div class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-5 rounded-3xl shadow-lg"><div class="text-sm opacity-80">مبيعات اليوم</div><div class="text-3xl font-black">${ts.length}</div></div>

 <div class="bg-white p-5 rounded-3xl shadow-sm"><div class="text-sm text-gray-400">أجهزة صيانة</div><div class="text-3xl font-black">${DB.repairs.filter(r=>r.status!=='تم التسليم').length}</div></div>
 <div class="bg-white p-5 rounded-3xl shadow-sm"><div class="text-sm text-gray-400">قيمة المخزن</div><div class="text-xl font-black">${DB.inv.reduce((s,i)=>s+i.qty*i.buy,0).toLocaleString()} ج</div></div></div>
 <div class="bg-white mt-4 p-5 rounded-3xl shadow-sm"><b>أهلا ${cur.n} 👋</b><p class="text-sm text-gray-500 mt-1">${cur.r==='sales'?'ادخل على واجهة البيع واختار القسم وبيع براحتك - كل عملية بتطلع ريسيت للعميل':cur.r==='store'?'ضيف أصناف جديدة براحتك - الحذف للادمن فقط':cur.r==='maintenance'?'عندك أجهزة محتاجة صيانة - سجل بيانات العميل ولما تخلص اكتب التكلفة': 'تحكم كامل في السيستم'}</p></div>`;
}

// ===== SALES SHOP - واجهة تفتح النفس =====
else if(page==='shop'){
 let cats=DB.cats;
 let filtered = salesCat==='all' ? DB.inv : DB.inv.filter(i=>i.catId===salesCat);
 let showCost = isAdmin();
 c.innerHTML=`
 <div class="mb-4"><h2 class="text-2xl font-black">🛍️ واجهة البيع</h2><p class="text-sm text-gray-400">اختار القسم ودوس بيع - الريسيت بيطلع تلقائيا</p></div>
 <div class="flex gap-3 overflow-x-auto pb-3 no-print">
  <button onclick="salesCat='all';R();go('shop')" class="cat-card shrink-0 px-5 py-3 rounded-2xl font-bold ${salesCat==='all'?'bg-gray-900 text-white shadow-lg':'bg-white shadow-sm'}">🌟 الكل</button>
  ${cats.map(cc=>`<button onclick="salesCat='${cc.id}';R();go('shop')" class="cat-card shrink-0 px-5 py-3 rounded-2xl font-bold ${salesCat===cc.id?'bg-emerald-600 text-white shadow-lg':'bg-white shadow-sm'}">${cc.icon} ${cc.n.replace('📱 ','').replace('🎧 ','')}</button>`).join('')}
 </div>

function addP(){let n=document.getElementById('pn').value,cat=document.getElementById('pcat').value,sub=document.getElementById('psub').value,im=document.getElementById('pi').value,q=+document.getElementById('pq').value||1,b=+document.getElementById('pb').value||0,s=+document.getElementById('ps').value||0;if(!n||!im)return alert('كمل البيانات');let cc=DB.cats.find(x=>x.id===cat);DB.inv.push({id:Date.now(),name:n,catId:cat,sub:sub||cc.n,imei:im,qty:q,buy:b,sell:s,img:cat==='acc'?'🎧':'📱'});save();alert('✅ اتضاف ويظهر للسيلز فورا');R();go('inv');}

function delAllSales(){if(!confirm('مسح كل مبيعات اليوم؟'))return;DB.sales=DB.sales.filter(s=>s.date!==todayStr());save();R();go('sales_mgmt');}

function impJ(e){let f=e.target.files[0];let r=new FileReader();r.onload=()=>{if(confirm('استرجاع؟')){DB=JSON.parse(r.result);save();location.reload();}};r.readAsText(f);}
let salesCat='all';

</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.proto ifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
